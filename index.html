<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ติวช่าง">
<title>ติวหัวหน้าฝ่ายช่าง</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="appleIcon" href="icon.svg">
<style>
:root{--primary:#1e3a8a;--accent:#2563eb;--bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#eef2ff;--bad:#dc2626;--ok:#16a34a;--r:16px;--tab:64px;--side:96px}
[data-theme="dark"]{--bg:#0b1220;--card:#121a2b;--text:#e5e7eb;--muted:#94a3b8;--line:#243049;--soft:#1b2540;--accent:#60a5fa;--ok:#22c55e;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Thonburi","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--primary);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;min-width:0}
.brand .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:6px}
.topbar .icon-btn{color:#fff;background:rgba(255,255,255,.14)}
.pill{font-size:.75rem;padding:2px 10px;border-radius:999px;background:#f59e0b;color:#111;font-weight:700}
main{max-width:980px;margin:0 auto;padding:16px 14px calc(var(--tab) + 24px + env(safe-area-inset-bottom))}
body.has-mini main{padding-bottom:calc(var(--tab) + 100px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:1.2rem}
.narrow{max-width:520px;margin:24px auto}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mt{margin-top:12px}
.center{text-align:center}
.sec{margin:20px 4px 10px;font-size:1.05rem}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:var(--soft);cursor:pointer;font-size:1.15rem;flex:none}
.icon-btn.sm{width:38px;height:38px;font-size:1rem}
.icon-btn.lg{width:52px;height:52px;font-size:1.3rem}
.icon-btn:disabled{opacity:.45;cursor:default}
.spin span{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.field input,.field select,.big-select{width:100%;min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.big-select{font-weight:700;font-size:1.05rem;margin:4px 0 12px}
.msg{min-height:1.2em;margin:8px 0;font-size:.9rem}
.msg.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--accent)}
.stat span{font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r);padding:14px;cursor:pointer;width:100%}
.tname{font-weight:700;font-size:1.05rem}
.tdesc{color:var(--muted);font-size:.9rem}
.tmeta{display:flex;gap:14px;font-size:.85rem;color:var(--muted);margin-top:auto}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0 12px;cursor:pointer;font-size:1rem}
.doc-head{display:flex;gap:12px;align-items:center}
.dicon{font-size:1.6rem}
.dtitle{font-weight:600}
.badge{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--soft)}
.badge.ok{background:#dcfce7;color:#166534}
.badge.wait{background:#fef3c7;color:#92400e}
.badge.bad{background:#fee2e2;color:#991b1b}
details.sums{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
details.sums summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
.slist{list-style:none;margin:6px 0 0;padding:0}
.slist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.slist li:last-child{border-bottom:0}
.num,.qn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);margin-bottom:14px}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:0 0 14px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--accent)}
.player{margin-top:10px;padding:14px;border-radius:14px;background:var(--soft)}
.pnow{text-align:center;font-weight:600;min-height:1.6em}
.pctrl{display:flex;justify-content:center;align-items:center;gap:14px;margin:10px 0}
.play{width:68px;height:68px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:1.6rem;cursor:pointer}
.rates,.chips{display:flex;gap:6px;flex-wrap:wrap}
.rates{justify-content:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;min-height:38px;cursor:pointer;font-size:.92rem}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{display:flex;gap:10px;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;width:100%}
.qitem.on{background:var(--soft);border-color:var(--accent)}
.qitem.on .qn{background:var(--accent);color:#fff}
.qt{display:block;font-size:.8rem;color:var(--muted)}
.qx{display:block}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.mode b{font-size:1rem}
.mode span{font-size:.82rem;color:var(--muted)}
.mode.on{border-color:var(--accent);background:var(--soft)}
.inline-num{width:96px;min-height:38px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.switch{display:flex;gap:10px;align-items:center;cursor:pointer;margin:12px 0}
.switch input{width:22px;height:22px;flex:none}
.progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.25rem;padding:2px 12px;border-radius:10px;background:var(--soft)}
.timer.warn{background:#fee2e2;color:#991b1b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.qtext{font-size:1.12rem;font-weight:600;margin:6px 0 14px;line-height:1.75}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;min-height:56px}
.opt .ol{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.sel .ol{background:var(--accent);color:#fff}
.opt.correct{border-color:var(--ok);background:rgba(22,163,74,.12)}
.opt.correct .ol{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:rgba(220,38,38,.10)}
.opt.wrong .ol{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1;color:inherit}
.fb{border-radius:14px;padding:12px 14px;margin-top:4px;background:var(--soft);border-left:5px solid var(--accent)}
.fb.ok{border-left-color:var(--ok)}
.fb.bad{border-left-color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:10px}
.qg{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:.9rem;position:relative}
.qg.ans{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.qg.ok{background:rgba(22,163,74,.15);border-color:var(--ok);color:var(--ok)}
.qg.bad{background:rgba(220,38,38,.12);border-color:var(--bad);color:var(--bad)}
.qg.cur{outline:3px solid var(--accent);outline-offset:1px}
.qg.mk::after{content:'★';position:absolute;top:-8px;right:-4px;font-size:.8rem;color:#f59e0b}
.big-score{font-size:3.2rem;font-weight:800;line-height:1.15}
.pass{color:var(--ok)}
.fail{color:var(--bad)}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.trow{padding:12px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.hrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.hrow:last-child{border-bottom:0}
.score-pill{flex:none;min-width:66px;text-align:center;font-weight:800;border-radius:999px;padding:4px 10px}
.score-pill.pass{background:rgba(22,163,74,.15)}
.score-pill.fail{background:rgba(220,38,38,.12)}
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-pass{stroke:var(--ok);stroke-width:2;stroke-dasharray:6 6}
.ch-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--card);stroke:var(--accent);stroke-width:3}
.ch-txt{fill:var(--muted);font-size:12px}
.rv{border-top:1px solid var(--line);padding:14px 0}
.rv:first-child{border-top:0;padding-top:0}
.rv .opt{min-height:0;padding:8px 10px;margin-bottom:6px;cursor:default}
.rv .qtext{font-size:1rem}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub{max-width:90%;padding:10px 14px;border-radius:16px;line-height:1.7;word-wrap:break-word;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.bub.err{background:rgba(220,38,38,.10);color:var(--bad)}
.bub .li{padding-left:4px}
.bub .sp{height:6px}
.bub .src{font-size:.78rem;color:var(--muted);margin-top:6px}
.bub-tools{display:flex;gap:6px;margin-top:6px}
.typing span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:52px;max-height:200px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);resize:vertical}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
.send{background:var(--primary);color:#fff}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tab);border:0;background:none;cursor:pointer;color:var(--muted)}
.tab .ti{font-size:1.3rem;line-height:1}
.tab .tl{font-size:.72rem}
.tab.on{color:var(--accent);font-weight:700}
#mini{position:fixed;left:10px;right:10px;bottom:calc(var(--tab) + 8px + env(safe-area-inset-bottom));z-index:29;display:flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border-radius:16px;padding:6px 8px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:760px;margin:0 auto}
#mini .icon-btn{background:rgba(255,255,255,.15);color:#fff}
.mtext{flex:1;min-width:0;text-align:left;border:0;background:none;color:#fff;cursor:pointer;display:flex;flex-direction:column}
.mtext b,.mtext span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtext span{font-size:.8rem;opacity:.85}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 100px);transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw;text-align:center;font-size:.92rem}
#toast.show{opacity:1}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.mode-grid{grid-template-columns:1fr}}
@media (min-width:900px){
  body.has-tabs{padding-left:var(--side)}
  .tabbar{top:0;bottom:0;right:auto;width:var(--side);flex-direction:column;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 12px);border-top:0;border-right:1px solid var(--line)}
  .tab{flex:none;height:80px}
  main,body.has-mini main{padding-bottom:110px}
  #mini{left:calc(var(--side) + 16px);bottom:16px}
  #toast{bottom:100px}
}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main id="main"></main>
<div id="mini" hidden></div>
<nav class="tabbar" id="tabbar" hidden></nav>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  const APP_VERSION = '4.0.0';
  const NL = String.fromCharCode(10);
  const K_CFG = 'tiw_cfg';
  const K_DATA = 'tiw_data';
  const K_HIDE = 'tiw_hide_install';
  const K_LOCAL = 'tiw_attempts';
  const K_FLAGS = 'tiw_flags';
  const K_SES = 'tiw_session';
  const K_OLD = 'tiw_hist';
  const K_CHAT = 'tiw_chat';
  const LETTERS = ['ก', 'ข', 'ค', 'ง'];
  const KEYS = ['a', 'b', 'c', 'd'];
  const MODE_LABEL = { practice: 'ฝึกทำ', mock: 'จำลองสอบ', review: 'ทวนข้อผิด' };
  const AI_STOP = ['QUOTA', 'NO_KEY', 'BAD_KEY', 'MODEL'];
  const SUGGEST = ['สรุปประเด็นสำคัญที่มักออกสอบ', 'มีตัวเลขหรือระยะเวลาอะไรที่ต้องจำบ้าง',
    'อธิบายให้เข้าใจง่ายเหมือนสอนมือใหม่', 'ยกตัวอย่างสถานการณ์ที่อาจออกเป็นข้อสอบ'];

  const DEFAULT_CFG = { apiUrl: '', pin: '', annId: '', theme: 'auto', font: 'normal',
    rate: 1, rateTouched: false, voice: '', qaPause: 5,
    exMode: 'practice', exTopics: [], exCount: 0, exMin: 0, exSmart: true,
    chatTopic: 'all', aiGeneral: false, autoSpeak: 'voice', autoSend: true,
    genTopic: '', genCount: 10, genDiff: 'กลาง' };
  let cfg = Object.assign({}, DEFAULT_CFG, loadJSON(K_CFG, {}));
  if (!Array.isArray(cfg.exTopics)) cfg.exTopics = [];
  if (!MODE_LABEL[cfg.exMode]) cfg.exMode = 'practice';
  let data = loadJSON(K_DATA, null);
  const state = { view: 'home', topicId: '', listenTopic: 'all', listenMode: 'summary',
    syncing: false, online: navigator.onLine, installEvt: null,
    examTab: 'start', ses: loadJSON(K_SES, null), res: null, gridOpen: false,
    aiTab: 'chat', chatBusy: false, chatDraft: '', listening: false, voiceAsked: false,
    genBusy: false, genMsg: '', genResult: null, procBusy: false, procMsg: '' };
  if (state.ses && (!Array.isArray(state.ses.qs) || !state.ses.qs.length)) state.ses = null;
  const player = { queue: [], key: '', idx: 0, chunkIdx: 0, playing: false, done: false, token: 0, timer: null, utter: null };
  let wakeLock = null;
  let toastTimer = null;
  let examTimer = null;
  let advTimer = null;
  let syncPromise = null;
  let recog = null;
  const hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  migrateOld();

  /* =========== ตัวช่วยทั่วไป =========== */
  function byId(id) { return document.getElementById(id); }
  function loadJSON(k, d) {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; }
  }
  function saveJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { toast('พื้นที่เก็บข้อมูลในเครื่องเต็ม'); return false; }
  }
  function saveCfg() { saveJSON(K_CFG, cfg); }
  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;')
      .split('"').join('&quot;').split("'").join('&#39;');
  }
  function br(s) { return esc(s).split(NL).join('<br>'); }
  function shortText(s, n) {
    s = String(s || '').split(NL).join(' ');
    return s.length > n ? s.slice(0, n) + '…' : s;
  }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function round1(v) { return Math.round((Number(v) || 0) * 10) / 10; }
  function fmtDate(v) {
    if (!v) return '-';
    const d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ':' + pad2(m) : pad2(m)) + ':' + pad2(s);
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    const m = Math.floor(sec / 60), s = sec % 60;
    if (!m) return s + ' วินาที';
    return m + ' นาที' + (s ? ' ' + s + ' วินาที' : '');
  }
  function toast(msg) {
    const t = byId('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3500);
  }
  function isIOS() {
    const ua = navigator.userAgent;
    return ua.indexOf('iPhone') > -1 || ua.indexOf('iPad') > -1 ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function isStandalone() {
    return navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  function isReady() { return !!(cfg.apiUrl && cfg.pin && data); }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function newId() {

  function stat(n, label) { return '<div class="stat"><b>' + n + '</b><span>' + label + '</span></div>'; }

  /* =========== ข้อมูล =========== */
  function list(name) { return (data && Array.isArray(data[name])) ? data[name] : []; }
  function anns() { return list('announcements'); }
  function aiInfo() { return (data && data.ai) || {}; }
  function currentAnn() {
    const a = anns();
    return a.find(function (x) { return x.id === cfg.annId; }) || a[0] || null;
  }
  function topicsOfAnn() {
    const all = list('topics');
    const ann = currentAnn();
    if (!ann) return all;
    const ids = list('links').filter(function (l) { return l.announcement_id === ann.id; })
      .map(function (l) { return l.topic_id; });
    if (!ids.length) return all;
    return all.filter(function (t) { return ids.indexOf(t.id) > -1; });
  }
  function topicById(id) { return list('topics').find(function (t) { return t.id === id; }) || null; }
  function docById(id) { return list('documents').find(function (d) { return d.id === id; }) || null; }
  function docsOf(tid) { return list('documents').filter(function (d) { return d.topic_id === tid; }); }
  function sumTopic(s) {
    if (s.topic_id) return s.topic_id;
    const d = docById(s.doc_id);
    return d ? d.topic_id : '';
  }
  function sumsOf(tid) {
    return list('summaries').filter(function (s) {
      return sumTopic(s) === tid && String(s.text || '').trim() !== '';

  function qsOf(tid) { return list('questions').filter(function (q) { return q.topic_id === tid && validQ(q); }); }
  function appName() { return (data && data.settings && data.settings.app_name) || 'ติวหัวหน้าฝ่ายช่าง'; }
  function settingNum(k, d) {
    const v = Number(data && data.settings && data.settings[k]);

  }
  function passPct() { return settingNum('pass_percent', 60); }
  function examCount() { return cfg.exCount || settingNum('exam_default_count', 20); }
  function examMinutes() { return cfg.exMin || settingNum('exam_default_minutes', 30); }
  function procCount(tids) {
    const set = {};
    tids.forEach(function (t) { set[t] = true; });
    return list('documents').filter(function (d) { return set[d.topic_id] && d.status === 'ประมวลผลแล้ว'; }).length;
  }

  /* =========== ข้อมูลข้อสอบ =========== */
  function validQ(q) {
    return !!(q && q.question && q.a && q.b && LETTERS.indexOf(String(q.answer)) > -1);
  }
  function questionsIn(tids) {
    const set = {};
    tids.forEach(function (t) { set[t] = true; });
    return list('questions').filter(function (q) { return set[q.topic_id] && validQ(q); });
  }
  function snapQ(q) {
    return { id: q.id, topic_id: q.topic_id, question: q.question, a: q.a || '', b: q.b || '', c: q.c || '', d: q.d || '',
      answer: String(q.answer), explanation: q.explanation || '', reference: q.reference || '' };
  }
  function findQ(id) {
    let pools = [];
    if (state.ses) pools = pools.concat(state.ses.qs);
    if (state.res) pools = pools.concat(state.res.qs);
    pools = pools.concat(list('questions'));
    return pools.find(function (q) { return q.id === id; }) || null;
  }
  function selectedTopics() {
    const topics = topicsOfAnn();
    const sel = cfg.exTopics.filter(function (id) { return topics.some(function (t) { return t.id === id; }); });
    return { sel: sel, tids: sel.length ? sel : topics.map(function (t) { return t.id; }) };
  }
  function topicLabel(ids) {
    const arr = (Array.isArray(ids) ? ids : String(ids || '').split(',')).filter(function (x) { return x; });
    if (!arr.length) return '';
    if (arr.length > 1) return 'หลายหัวข้อ (' + arr.length + ')';
    const t = topicById(arr[0]);

  function localAttempts() { return loadJSON(K_LOCAL, []); }
  function saveLocal(arr) {
    const uns = arr.filter(function (a) { return !a.synced; });
    const syn = arr.filter(function (a) { return a.synced; }).slice(-30);
    const all = syn.concat(uns).sort(function (a, b) { return String(a.date) < String(b.date) ? -1 : 1; });
    saveJSON(K_LOCAL, all);
  }
  function pendingCount() { return localAttempts().filter(function (a) { return !a.synced; }).length; }
  function migrateOld() {
    const old = loadJSON(K_OLD, null);
    localStorage.removeItem(K_OLD);
    if (!Array.isArray(old) || !old.length) return;
    const cur = localAttempts();
    const ids = cur.map(function (a) { return a.id; });
    old.forEach(function (a) {
      if (a && a.id && ids.indexOf(a.id) === -1) { a.synced = false; cur.push(a); }
    });
    saveLocal(cur);
  }
  function qStats() {
    const m = {};
    list('questions').forEach(function (q) {
      m[q.id] = { n: Number(q.attempts) || 0, w: Number(q.wrongs) || 0, last: String(q.last_result || '') };
    });
    const savedAt = (data && data.savedAt) || '';
    localAttempts().forEach(function (a) {
      if (a.synced && savedAt && String(a.syncedAt) < savedAt) return;
      (a.answers || []).forEach(function (x) {
        if (!m[x.qid]) m[x.qid] = { n: 0, w: 0, last: '' };
        const s = m[x.qid];
        s.n++;
        if (!x.correct) s.w++;
        s.last = x.correct ? 'ถูก' : 'ผิด';
      });
    });
    return m;
  }
  function wrongCount(tids) {
    const st = qStats();
    return questionsIn(tids).filter(function (q) { return (st[q.id] || {}).last === 'ผิด'; }).length;
  }
  function allHistory() {
    const server = list('history');
    const ids = {};
    server.forEach(function (h) { ids[String(h.id)] = true; });
    const extra = localAttempts().filter(function (a) { return !ids[String(a.id)]; });
    return server.concat(extra).filter(function (h) { return Number(h.total) > 0; })
      .sort(function (a, b) { return String(a.date) < String(b.date) ? -1 : 1; });
  }

  /* =========== เชื่อมต่อหลังบ้าน =========== */
  function api(action, extra, timeoutMs) {
    const body = Object.assign({ action: action, pin: cfg.pin }, extra || {});
    const ctrl = window.AbortController ? new AbortController() : null;
    const timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, timeoutMs || 45000);
    return fetch(cfg.apiUrl, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) { return r.json(); })
      .catch(function (err) {
        clearTimeout(timer);
        if (err && err.name === 'AbortError') throw new Error('เซิร์ฟเวอร์ตอบช้าเกินไป ลองใหม่อีกครั้ง');
        throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต ลิงก์ Web App และการ Deploy แบบ "ทุกคน"');
      })
      .then(function (res) {
        clearTimeout(timer);
        if (!res || !res.ok) {
          const e = new Error((res && res.error) || 'เกิดข้อผิดพลาด');
          e.code = res && res.code;
          throw e;
        }
        return res.data;
      });
  }

  function sendFlags() {
    const fl = loadJSON(K_FLAGS, []);
    if (!fl.length) return Promise.resolve();
    return api('flagQuestion', fl[0]).catch(function (err) {
      if (err.code !== 'NOT_FOUND') throw err;
    }).then(function () {
      saveJSON(K_FLAGS, loadJSON(K_FLAGS, []).slice(1));
      return sendFlags();
    });
  }

  function syncAll() {
    if (syncPromise) return syncPromise;
    if (!navigator.onLine || !cfg.apiUrl || !cfg.pin) return Promise.resolve(false);
    const todo = localAttempts().filter(function (a) { return !a.synced; });
    let p = Promise.resolve();
    if (todo.length) {
      p = p.then(function () { return api('saveAttempts', { attempts: todo }); }).then(function () {
        const ids = todo.map(function (a) { return a.id; });
        const now = new Date().toISOString();
        const cur = localAttempts();
        cur.forEach(function (a) {
          if (ids.indexOf(a.id) > -1 && !a.synced) { a.synced = true; a.syncedAt = now; }
        });
        saveLocal(cur);
      });
    }
    p = p.then(sendFlags);
    syncPromise = p.then(function () { syncPromise = null; return true; },
      function (err) { syncPromise = null; throw err; });
    return syncPromise;
  }

  function refresh(silent) {
    if (!cfg.apiUrl || !cfg.pin) return Promise.resolve();
    if (!navigator.onLine) {
      if (!silent) toast('ออฟไลน์อยู่ ใช้ข้อมูลที่เก็บในเครื่อง');
      return Promise.resolve();
    }
    if (state.syncing) return Promise.resolve();
    state.syncing = true;
    renderHeader();
    return syncAll().catch(function () { /* ส่งรอบหน้า */ }).then(function () {
      return api('bootstrap');
    }).then(function (d) {
      d.savedAt = new Date().toISOString();
      data = d;
      saveJSON(K_DATA, d);
      applyServerSettings();
      if (!silent) toast('อัปเดตข้อมูลแล้ว ✅');
    }).catch(function (err) {
      if (err.code === 'AUTH' || err.code === 'NO_PIN' || err.code === 'LOCKED') toast(err.message + ' (แก้ได้ที่ ⚙️)');
      else if (!silent || !data) toast(err.message);
    }).then(function () {
      state.syncing = false;
      const ae = document.activeElement;
      const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA');
      if (typing || state.listening) { renderHeader(); renderTabs(); } else render();
    });
  }

  function applyServerSettings() {
    const s = (data && data.settings) || {};
    if (!cfg.rateTouched && Number(s.speech_rate) > 0) { cfg.rate = Number(s.speech_rate); saveCfg(); }
  }

  /* =========== ธีม / ไอคอน =========== */
  function applyTheme() {
    let t = cfg.theme;
    if (t === 'auto') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    const sizes = { normal: '16px', large: '18px', xlarge: '20px' };
    document.documentElement.style.fontSize = sizes[cfg.font] || '16px';
    const col = String((data && data.settings && data.settings.theme_color) || '');
    if (col.charAt(0) === '#' && (col.length === 7 || col.length === 4)) {
      document.documentElement.style.setProperty('--primary', col);
      const m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', col);
    }
  }

  function makeAppleIcon() {
    try {
      const c = document.createElement('canvas');
      c.width = 180; c.height = 180;
      const g = c.getContext('2d');
      g.scale(180 / 512, 180 / 512);
      g.fillStyle = '#1e3a8a'; g.fillRect(0, 0, 512, 512);
      g.fillStyle = '#fbbf24';
      g.beginPath(); g.arc(256, 300, 120, Math.PI, 0); g.closePath(); g.fill();
      g.fillRect(106, 296, 300, 34);
      g.fillStyle = '#f59e0b'; g.fillRect(240, 170, 32, 70);
      g.strokeStyle = '#ffffff'; g.lineWidth = 28; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(196, 380); g.lineTo(236, 420); g.lineTo(316, 340); g.stroke();
      byId('appleIcon').setAttribute('href', c.toDataURL('image/png'));
    } catch (e) { /* ใช้ไอคอนเดิม */ }
  }

  /* =========== เสียงอ่าน =========== */
  function hasTTS() { return 'speechSynthesis' in window; }
  function thaiVoices() {
    if (!hasTTS()) return [];
    return window.speechSynthesis.getVoices().filter(function (v) {
      return String(v.lang || '').toLowerCase().indexOf('th') === 0;
    });
  }
  function pickVoice() {
    const vs = thaiVoices();
    if (!vs.length) return null;
    return vs.find(function (v) { return v.name === cfg.voice; }) || vs[0];
  }
  function chunkText(text) {
    const out = [];
    String(text || '').split(NL).forEach(function (line) {
      let cur = '';
      line.split(' ').forEach(function (w) {
        if (!w) return;
        while (w.length > 220) {
          if (cur) { out.push(cur); cur = ''; }
          out.push(w.slice(0, 220));
          w = w.slice(220);
        }
        if (!w) return;
        if (cur && (cur.length + w.length + 1) > 160) { out.push(cur); cur = w; }
        else cur = cur ? cur + ' ' + w : w;
      });
      if (cur) out.push(cur);
    });
    return out;
  }
  function qaChunks(q) {
    let c = chunkText('คำถาม. ' + q.question);
    KEYS.forEach(function (k, i) { if (q[k]) c = c.concat(chunkText('ข้อ ' + LETTERS[i] + '. ' + q[k])); });
    c.push((Number(cfg.qaPause) || 5) * 1000);
    const ai = LETTERS.indexOf(String(q.answer));
    c = c.concat(chunkText('เฉลย ข้อ ' + q.answer + (ai > -1 && q[KEYS[ai]] ? '. ' + q[KEYS[ai]] : '')));
    if (q.explanation) c = c.concat(chunkText('คำอธิบาย. ' + q.explanation));
    return c;
  }
  function buildQueue(mode, tkey) {
    const tids = tkey === 'all' ? topicsOfAnn().map(function (t) { return t.id; }) : [tkey];
    const q = [];
    tids.forEach(function (tid) {
      const t = topicById(tid);
      const tname = t ? t.name : '';
      if (mode === 'qa') {
        qsOf(tid).forEach(function (x) {
          q.push({ id: x.id, title: tname, text: x.question, answer: x.answer, chunks: qaChunks(x) });
        });
      } else {
        sumsOf(tid).forEach(function (s) {
          const d = docById(s.doc_id);
          q.push({ id: s.id, title: d ? d.title : tname, text: s.text, chunks: chunkText(s.text) });
        });
      }
    });
    return q;
  }
  function selKey() { return state.listenMode + '|' + (state.listenTopic || 'all'); }
  function playSelection(start) {
    const key = selKey();
    if (player.key !== key || !player.queue.length) {
      player.queue = buildQueue(state.listenMode, state.listenTopic || 'all');
      player.key = key;
    }
    if (!player.queue.length) { toast('ไม่มีรายการให้ฟัง'); return; }
    playItem(start || 0);
  }
  function speakText(key, title, text) {
    player.queue = [{ id: key, title: title, text: text, chunks: chunkText(text) }];
    player.key = 'one|' + key;
    playItem(0);
  }
  function startSpeak(tk) {
    if (!hasTTS()) { toast('เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน'); player.playing = false; updatePlayerUI(); return; }
    clearTimeout(player.timer);
    const ss = window.speechSynthesis;
    if (ss.speaking || ss.pending) {
      ss.cancel();
      player.timer = setTimeout(function () { speakChunk(tk); }, 150);
    } else {
      speakChunk(tk);
    }
  }
  function speakChunk(tk) {
    if (tk !== player.token || !player.playing) return;
    const item = player.queue[player.idx];
    if (!item) { finishAll(); return; }
    if (player.chunkIdx >= item.chunks.length) {
      if (player.idx + 1 < player.queue.length) {
        player.idx++;
        player.chunkIdx = 0;
        updatePlayerUI();
        player.timer = setTimeout(function () { speakChunk(tk); }, 700);
      } else {
        finishAll();
      }
      return;
    }
    const c = item.chunks[player.chunkIdx];
    if (typeof c === 'number') {
      player.timer = setTimeout(function () {
        if (tk !== player.token) return;
        player.chunkIdx++;
        speakChunk(tk);
      }, c);
      return;
    }
    const u = new SpeechSynthesisUtterance(c);
    u.lang = 'th-TH';
    u.rate = Number(cfg.rate) || 1;
    const v = pickVoice();
    if (v) u.voice = v;
    u.onend = function () {
      if (tk !== player.token) return;
      player.chunkIdx++;
      speakChunk(tk);
    };
    u.onerror = function (ev) {
      if (tk !== player.token) return;
      if (ev && (ev.error === 'interrupted' || ev.error === 'canceled')) return;
      player.chunkIdx++;
      speakChunk(tk);
    };
    player.utter = u;
    window.speechSynthesis.speak(u);
  }
  function playItem(i) {
    if (i < 0 || i >= player.queue.length) return;
    player.token++;
    player.idx = i;
    player.chunkIdx = 0;
    player.playing = true;
    player.done = false;
    keepAwake(true);
    startSpeak(player.token);
    updatePlayerUI();
  }
  function finishAll() {
    player.playing = false;
    player.done = true;
    keepAwake(false);
    updatePlayerUI();
    if (player.queue.length > 1) toast('ฟังจบแล้ว 🎉');
  }
  function pauseSpeech() {
    player.playing = false;
    player.token++;
    clearTimeout(player.timer);
    try { window.speechSynthesis.cancel(); } catch (e) { /* ไม่เป็นไร */ }
    keepAwake(false);
    updatePlayerUI();
  }
  function resumeSpeech() {
    if (player.done) { playItem(0); return; }
    player.playing = true;
    player.token++;
    keepAwake(true);
    startSpeak(player.token);
    updatePlayerUI();
  }
  function togglePlay() {
    if (!player.queue.length) return;
    if (player.playing) pauseSpeech(); else resumeSpeech();
  }
  function stopAll() {
    pauseSpeech();
    player.queue = [];
    player.key = '';
    player.idx = 0;
    player.chunkIdx = 0;
    updatePlayerUI();
  }
  function nextItem() {
    if (!player.queue.length) return;
    if (player.idx + 1 < player.queue.length) playItem(player.idx + 1);
    else toast('รายการสุดท้ายแล้ว');
  }
  function prevItem() {
    if (!player.queue.length) return;
    if (player.chunkIdx > 1 || player.idx === 0) playItem(player.idx);
    else playItem(player.idx - 1);
  }
  function keepAwake(on) {
    try {
      if (on && navigator.wakeLock && !wakeLock) {
        navigator.wakeLock.request('screen').then(function (l) {
          wakeLock = l;
          l.addEventListener('release', function () { wakeLock = null; });
        }).catch(function () { /* ไม่รองรับ */ });
      } else if (!on && wakeLock && !player.playing && !state.procBusy && !state.genBusy) {
        wakeLock.release();
        wakeLock = null;
      }
    } catch (e) { /* ไม่รองรับ */ }
  }
  function nowText(same) {
    if (same && player.queue.length) {
      const it = player.queue[player.idx] || {};
      return (player.playing ? '🔊 กำลังฟัง ' : '⏸ หยุดที่ ') + 'ข้อ ' + (player.idx + 1) + '/' + player.queue.length +
        '<div class="small muted">' + esc(it.title || '') + '</div>';
    }
    return 'กด ▶ เพื่อเริ่มฟัง หรือแตะรายการที่ต้องการ';
  }
  function updatePlayerUI() {
    renderMini();
    if (state.view !== 'listen') return;
    const same = player.key === selKey();
    const now = byId('pNow');
    if (now) now.innerHTML = nowText(same);
    const pb = byId('pPlay');
    if (pb) pb.textContent = (same && player.playing) ? '⏸' : '▶';
    const nodes = document.querySelectorAll('[data-qi]');
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const on = same && player.queue.length > 0 && Number(n.getAttribute('data-qi')) === player.idx;
      n.classList.toggle('on', on);
      if (on && player.playing) n.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  /* =========== ระบบข้อสอบ =========== */
  function saveSession() { if (state.ses) saveJSON(K_SES, state.ses); }
  function timeLeft(s) { return Math.max(0, Math.round((s.endAt - Date.now()) / 1000)); }
  function answeredCount(s) { return s.qs.filter(function (q) { return s.answers[q.id]; }).length; }

  function smartPick(pool, st) {
    const arr = shuffle(pool);
    const pri = {};
    arr.forEach(function (q) {
      const s = st[q.id] || { n: 0, w: 0, last: '' };
      let p = 0;
      if (s.last === 'ผิด') p += 3;
      if (!s.n) p += 2;
      if (s.n) p += s.w / s.n;
      pri[q.id] = p;
    });
    return arr.sort(function (a, b) { return pri[b.id] - pri[a.id]; });
  }

  function startSession(o) {
    const st = qStats();
    let pool = o.qs ? o.qs.slice() : questionsIn(o.tids || []);
    if (o.mode === 'review' && !o.qs) pool = pool.filter(function (q) { return (st[q.id] || {}).last === 'ผิด'; });
    if (!pool.length) {
      toast(o.mode === 'review' ? 'ไม่มีข้อที่ต้องทวนแล้ว เยี่ยมมาก 👍' : 'ไม่มีข้อสอบตามเงื่อนไขที่เลือก');
      return;
    }
    let qs = (o.mode === 'practice' && o.smart && !o.qs) ? smartPick(pool, st) : shuffle(pool);
    const n = Math.max(1, Math.min(Number(o.count) || qs.length, qs.length));
    qs = qs.slice(0, n);
    const now = Date.now();
    const min = Math.max(1, Number(o.minutes) || 30);
    state.ses = {
      id: newId(), mode: o.mode, qs: qs.map(snapQ), cur: 0, answers: {}, marks: {},
      startAt: now, limitMin: o.mode === 'mock' ? min : 0, endAt: o.mode === 'mock' ? now + min * 60000 : 0
    };
    state.gridOpen = o.mode === 'mock';
    saveSession();
    startTimer();
    state.view = 'exam';
    render();
    window.scrollTo(0, 0);
  }

  function endSession() {
    clearInterval(examTimer);
    clearTimeout(advTimer);
    state.ses = null;
    localStorage.removeItem(K_SES);
  }

  function guardSession() {
    if (!state.ses) return true;
    if (!window.confirm('มีข้อสอบที่ทำค้างอยู่ ต้องการทิ้งชุดเดิมแล้วเริ่มชุดใหม่?')) return false;
    endSession();
    return true;
  }

  function startTimer() {
    clearInterval(examTimer);
    const s = state.ses;
    if (!s || s.mode !== 'mock') return;
    examTimer = setInterval(tick, 1000);
    tick();
  }

  function tick() {
    const s = state.ses;
    if (!s || s.mode !== 'mock') { clearInterval(examTimer); return; }
    const left = timeLeft(s);
    const el = byId('exTimer');
    if (el) {
      el.textContent = fmtClock(left);
      el.classList.toggle('warn', left <= 300);
    }
    if (left <= 0) {
      clearInterval(examTimer);
      finishSession(true);
    }
  }

  function finishSession(auto) {
    const s = state.ses;
    if (!s) return;
    clearInterval(examTimer);
    clearTimeout(advTimer);
    const isMock = s.mode === 'mock';
    const items = s.qs.filter(function (q) { return isMock || s.answers[q.id]; });
    if (!items.length) {
      endSession();
      toast('ยังไม่ได้ตอบข้อใด จึงไม่บันทึกผล');
      goTo('exam');
      return;
    }
    const answers = items.map(function (q) {
      const chosen = s.answers[q.id] || '';
      return { qid: q.id, chosen: chosen, correct: chosen === String(q.answer) };
    });
    const correct = answers.filter(function (x) { return x.correct; }).length;
    const endTime = isMock ? Math.min(Date.now(), s.endAt) : Date.now();
    const tids = [];
    items.forEach(function (q) { if (tids.indexOf(q.topic_id) === -1) tids.push(q.topic_id); });
    const attempt = {
      id: s.id, date: new Date().toISOString(), mode: MODE_LABEL[s.mode], topic_ids: tids,
      total: items.length, correct: correct, score: round1(correct * 100 / items.length),
      time_used: Math.round((endTime - s.startAt) / 1000), time_limit: isMock ? s.limitMin : '',
      wrong_ids: answers.filter(function (x) { return !x.correct; }).map(function (x) { return x.qid; }).join(','),
      answers: answers, synced: false
    };
    const cur = localAttempts();
    cur.push(attempt);
    saveLocal(cur);
    endSession();
    state.res = { attempt: attempt, qs: items, filter: 'all' };
    state.view = 'result';
    render();
    window.scrollTo(0, 0);
    if (auto) toast('⏰ หมดเวลา ระบบส่งข้อสอบให้อัตโนมัติ');
    refresh(true);
  }

  /* =========== AI: แชต / ไมค์ / ออกข้อสอบ / ประมวลผล =========== */
  function chatLog() { return loadJSON(K_CHAT, []); }
  function saveChat(a) { saveJSON(K_CHAT, a.slice(-60)); }
  function chatTopicIds() {
    const topics = topicsOfAnn();
    if (cfg.chatTopic !== 'all' && topics.some(function (t) { return t.id === cfg.chatTopic; })) return [cfg.chatTopic];
    return topics.map(function (t) { return t.id; });
  }
  function scrollEnd() { setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 40); }

  function mdLite(s) {
    return String(s || '').split(NL).map(function (line) {
      let t = line.trim();
      if (!t) return '<div class="sp"></div>';
      let bullet = false;
      if (t.charAt(0) === '#') {
        while (t.charAt(0) === '#') t = t.slice(1);
        t = '**' + t.trim() + '**';
      }
      if (t.indexOf('- ') === 0 || t.indexOf('* ') === 0 || t.indexOf('• ') === 0) { bullet = true; t = t.slice(2); }
      const html = esc(t).split('**').map(function (p, i) { return i % 2 ? '<b>' + p + '</b>' : p; }).join('');
      return bullet ? '<div class="li">• ' + html + '</div>' : '<div>' + html + '</div>';
    }).join('');
  }
  function plainText(s) {
    return String(s || '').split('**').join('').split(NL).map(function (l) {
      let t = l.trim();
      while (t.charAt(0) === '#') t = t.slice(1);
      t = t.trim();
      if (t.indexOf('- ') === 0 || t.indexOf('* ') === 0 || t.indexOf('• ') === 0) t = t.slice(2);
      return t;
    }).filter(function (t) { return t; }).join(NL);
  }

  function sendChat(text) {
    const box = byId('chatIn');
    const q = String(text || (box ? box.value : '') || '').trim();
    if (!q || state.chatBusy) return;
    if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ตเพื่อถาม AI'); return; }
    const voice = state.voiceAsked;
    state.voiceAsked = false;
    const msgs = chatLog();
    const hist = msgs.filter(function (m) { return !m.err; }).slice(-6)
      .map(function (m) { return { role: m.role, text: String(m.text).slice(0, 1500) }; });
    msgs.push({ role: 'user', text: q, t: Date.now() });
    saveChat(msgs);
    state.chatDraft = '';
    state.chatBusy = true;
    render();
    scrollEnd();
    api('chat', { question: q, topic_ids: chatTopicIds(), history: hist, allowGeneral: !!cfg.aiGeneral }, 150000)
      .then(function (d) {
        const arr = chatLog();
        arr.push({ role: 'model', text: d.answer, sources: d.sources || [], t: Date.now() });
        saveChat(arr);
        if (cfg.autoSpeak === 'always' || (cfg.autoSpeak === 'voice' && voice)) {
          speakText('chat' + Date.now(), 'คำตอบ AI', plainText(d.answer));
        }
      }).catch(function (err) {
        const arr = chatLog();
        arr.push({ role: 'model', text: '⚠️ ' + err.message, err: true, t: Date.now() });
        saveChat(arr);
      }).then(function () {
        state.chatBusy = false;
        if (state.view === 'chat') { render(); scrollEnd(); }
      });
  }

  function updateMicBtn() {
    const b = byId('micBtn');
    if (b) b.classList.toggle('on', state.listening);
  }

  function toggleMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      toast('เครื่องนี้ใช้ไมค์ในแอปไม่ได้ ให้แตะช่องพิมพ์ แล้วกด 🎤 บนแป้นพิมพ์แทน');
      const b0 = byId('chatIn');
      if (b0) b0.focus();
      return;
    }
    if (state.listening && recog) { recog.stop(); return; }
    if (state.chatBusy) return;
    pauseSpeech();
    const box = byId('chatIn');
    const base = box && box.value.trim() ? box.value.trim() + ' ' : '';
    let finalText = '';
    recog = new SR();
    recog.lang = 'th-TH';
    recog.interimResults = true;
    recog.continuous = false;
    recog.onresult = function (ev) {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      const b = byId('chatIn');
      if (b) b.value = base + finalText + interim;
      state.chatDraft = base + finalText + interim;
    };
    recog.onerror = function (ev) {
      state.listening = false;
      updateMicBtn();
      const e = ev && ev.error;
      if (e === 'not-allowed' || e === 'service-not-allowed') toast('ไม่ได้รับอนุญาตใช้ไมค์ ให้กด 🎤 บนแป้นพิมพ์แทน');
      else if (e === 'no-speech') toast('ไม่ได้ยินเสียง ลองพูดใหม่อีกครั้ง');
      else if (e && e !== 'aborted') toast('ไมค์มีปัญหา (' + e + ') ให้กด 🎤 บนแป้นพิมพ์แทน');
    };
    recog.onend = function () {
      state.listening = false;
      updateMicBtn();
      const b = byId('chatIn');
      const t = b ? b.value.trim() : '';
      if (finalText.trim() && t && cfg.autoSend) {
        state.voiceAsked = true;
        sendChat(t);
      }
    };
    try {
      recog.start();
      state.listening = true;
      updateMicBtn();
      toast('🎤 พูดได้เลย');
    } catch (e) {
      state.listening = false;
      toast('เปิดไมค์ไม่ได้ ให้กด 🎤 บนแป้นพิมพ์แทน');
    }
  }

  function genTopicId() {
    const topics = topicsOfAnn();
    if (topics.some(function (t) { return t.id === cfg.genTopic; })) return cfg.genTopic;
    return topics[0] ? topics[0].id : '';
  }

  function genQuiz() {
    const tid = genTopicId();
    if (!tid || state.genBusy) return;
    if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ต'); return; }
    const total = Number(cfg.genCount) || 10;
    const diff = cfg.genDiff || 'กลาง';
    const got = [];
    let rounds = 0;
    const maxRounds = Math.ceil(total / 10) + 1;
    state.genBusy = true;
    state.genResult = null;
    keepAwake(true);
    function step() {
      const left = total - got.length;
      if (left <= 0 || rounds >= maxRounds) return Promise.resolve();
      rounds++;
      state.genMsg = '⏳ AI กำลังออกข้อสอบ... ได้แล้ว ' + got.length + '/' + total + ' ข้อ';
      if (state.view === 'chat') render();
      return api('genQuestions', { topic_id: tid, count: Math.min(10, left), difficulty: diff }, 300000).then(function (d) {
        const qs = (d && d.questions) || [];
        if (!qs.length) throw new Error('AI ไม่ได้ส่งข้อสอบที่ใช้ได้กลับมา ลองใหม่อีกครั้ง');
        qs.forEach(function (q) { got.push(q); });
        if (data) { data.questions = list('questions').concat(qs); saveJSON(K_DATA, data); }
        return step();
      });
    }
    step().then(function () {
      state.genMsg = '✅ ออกข้อสอบเสร็จ ' + got.length + ' ข้อ บันทึกลงคลังแล้ว';
    }).catch(function (err) {
      state.genMsg = '⚠️ ' + err.message + (got.length ? ' (ได้มาแล้ว ' + got.length + ' ข้อ บันทึกไว้แล้ว)' : '');
    }).then(function () {
      state.genBusy = false;
      state.genResult = got.length ? got : null;
      keepAwake(false);
      if (state.view === 'chat') render(); else toast(state.genMsg);
    });
  }

  function processDocs(ids) {
    if (!ids.length || state.procBusy) return;
    if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ต'); return; }
    state.procBusy = true;
    keepAwake(true);
    let i = 0, ok = 0, fail = 0, lastErr = '';
    function done(stopMsg) {
      state.procBusy = false;
      keepAwake(false);
      state.procMsg = (stopMsg ? '⚠️ หยุดก่อน: ' + stopMsg + NL : '') + '✅ สำเร็จ ' + ok + ' ฉบับ' +
        (fail ? ' · ผิดพลาด ' + fail + ' ฉบับ' + (lastErr && !stopMsg ? NL + 'ล่าสุด: ' + lastErr : '') : '');
      if (state.view === 'chat') render();
      refresh(true);
    }
    function next() {
      if (i >= ids.length) { done(''); return; }
      const d = docById(ids[i]);
      state.procMsg = '⏳ กำลังประมวลผล ' + (i + 1) + '/' + ids.length + ': ' + (d ? d.title : ids[i]) + NL +
        'ฉบับละประมาณ 1-3 นาที ระหว่างนี้อย่าปิดแอป';
      if (state.view === 'chat') render();
      api('processDoc', { id: ids[i] }, 340000).then(function (r) {
        ok++;
        if (d) { d.status = 'ประมวลผลแล้ว'; d.char_count = r.chars; d.note = r.note; }
        i++;
        next();
      }).catch(function (err) {
        fail++;
        lastErr = err.message;
        const stop = AI_STOP.indexOf(err.code) > -1;
        if (d) { if (!stop) d.status = 'ผิดพลาด'; d.note = err.message; }
        if (stop) { done(err.message); return; }
        i++;
        next();
      });
    }
    next();
  }

    const ann = currentAnn();
    const topics = topicsOfAnn();
    let h = '<section class="card"><h2>📚 คลังความรู้</h2><div class="muted">' + esc(ann ? ann.name : '') + '</div></section>';
    h += topics.length ? '<div class="grid">' + topics.map(topicCard).join('') + '</div>'
      : '<div class="empty">ยังไม่มีหัวข้อในประกาศนี้</div>';
    return h;
  }

  function docIcon(t) {
    const m = { 'PDF': '📕', 'รูปภาพ': '🖼️', 'ลิงก์': '🔗', 'ข้อความ': '📝' };
    return m[t] || '📄';
  }
  function statusBadge(s) {
    if (s === 'ประมวลผลแล้ว') return '<span class="badge ok">ประมวลผลแล้ว</span>';
    if (s === 'ผิดพลาด') return '<span class="badge bad">ผิดพลาด</span>';
    return '<span class="badge wait">' + esc(s || 'รอประมวลผล') + '</span>';
  }
  function sumList(items, open) {
    if (!items.length) return '';
    return '<details class="sums"' + (open ? ' open' : '') + '><summary>สรุป ' + items.length + ' ข้อ</summary><ul class="slist">' +
      items.map(function (s, i) {
        return '<li><span class="num">' + (i + 1) + '</span><div class="grow">' + br(s.text) + '</div>' +
          '<button class="icon-btn sm" data-act="speakOne" data-id="' + esc(s.id) + '" aria-label="ฟัง">🔊</button></li>';
      }).join('') + '</ul></details>';
  }

  function viewTopic() {
    const t = topicById(state.topicId);
    if (!t) { state.view = 'learn'; return viewLearn(); }
    const docs = docsOf(t.id), sums = sumsOf(t.id), qs = qsOf(t.id);
    const wc = wrongCount([t.id]);
    let h = '<button class="back" data-act="go" data-id="learn">‹ กลับ</button>';
    h += '<section class="card"><h2>' + esc(t.name) + '</h2>' +
      (t.description ? '<p class="muted">' + br(t.description) + '</p>' : '') +
      '<div class="row wrap">' +
      '<button class="btn primary" data-act="listenTopic" data-id="' + esc(t.id) + '"' + (sums.length ? '' : ' disabled') + '>🎧 ฟังสรุป (' + sums.length + ')</button>' +
      '<button class="btn" data-act="listenQA" data-id="' + esc(t.id) + '"' + (qs.length ? '' : ' disabled') + '>❓ ฟังถาม-ตอบ</button>' +
      '<button class="btn" data-act="practiceTopic" data-id="' + esc(t.id) + '"' + (qs.length ? '' : ' disabled') + '>✏️ ฝึกทำ (' + qs.length + ' ข้อ)</button>' +
      (wc ? '<button class="btn" data-act="reviewTopic" data-id="' + esc(t.id) + '">🔁 ทวนข้อผิด (' + wc + ')</button>' : '') +
      '<button class="btn" data-act="chatTopicGo" data-id="' + esc(t.id) + '">💬 ถาม AI เรื่องนี้</button>' +
      '<button class="btn" data-act="genTopicGo" data-id="' + esc(t.id) + '">🧠 AI ออกข้อสอบ</button>' +
      '</div></section>';

    h += '<h3 class="sec">เอกสาร (' + docs.length + ')</h3>';
    if (!docs.length) h += '<div class="empty">ยังไม่มีเอกสารในหัวข้อนี้ วางไฟล์ในโฟลเดอร์ Drive ของหัวข้อนี้ แล้วไปที่ 💬 ถาม AI > 📂 เอกสาร</div>';
    docs.forEach(function (d) {
      const ds = sums.filter(function (s) { return s.doc_id === d.id; });
      h += '<section class="card"><div class="doc-head"><span class="dicon">' + docIcon(d.type) + '</span>' +
        '<div class="grow"><div class="dtitle">' + esc(d.title || '(ไม่มีชื่อ)') + '</div>' +
        '<div class="small muted">' + esc(d.type || '') + ' ' + statusBadge(d.status) + '</div></div>' +
        (d.open_url ? '<button class="btn sm" data-act="openDoc" data-id="' + esc(d.id) + '">เปิด ↗</button>' : '') + '</div>' +
        (d.note ? '<div class="small muted mt">' + br(d.note) + '</div>' : '') + sumList(ds, false) + '</section>';
    });
    const loose = sums.filter(function (s) {
      return !s.doc_id || !docs.some(function (d) { return d.id === s.doc_id; });
    });
    if (loose.length) h += '<h3 class="sec">สรุปทั่วไป</h3><section class="card">' + sumList(loose, true) + '</section>';
    return h;
  }

  /* ---------- ฟัง ---------- */
  function viewListen() {
    const topics = topicsOfAnn();
    const tkey = state.listenTopic || 'all';
    const items = buildQueue(state.listenMode, tkey);
    const same = player.key === selKey();
    let h = '<section class="card"><h2>🎧 ฟังเนื้อหา</h2>';
    h += '<div class="seg">' + segBtn('mode', 'summary', 'สรุปเนื้อหา', state.listenMode) + segBtn('mode', 'qa', 'ถาม-ตอบ', state.listenMode) + '</div>';
    h += '<label class="field"><span>หัวข้อ</span><select data-change="listenTopic"><option value="all">ทุกหัวข้อในประกาศนี้</option>' +
      topics.map(function (t) {
        return '<option value="' + esc(t.id) + '"' + (t.id === tkey ? ' selected' : '') + '>' + esc(t.name) + '</option>';
      }).join('') + '</select></label>';
    h += '<div class="player"><div id="pNow" class="pnow">' + nowText(same) + '</div>' +
      '<div class="pctrl"><button class="icon-btn lg" data-act="pPrev" aria-label="ก่อนหน้า">⏮</button>' +
      '<button id="pPlay" class="play" data-act="pToggleSel" aria-label="เล่น/หยุด">' + (same && player.playing ? '⏸' : '▶') + '</button>' +
      '<button class="icon-btn lg" data-act="pNext" aria-label="ถัดไป">⏭</button>' +
      '<button class="icon-btn lg" data-act="pStop" aria-label="หยุด">⏹</button></div>' +
      '<div class="rates">' + [0.75, 1, 1.25, 1.5, 2].map(function (r) {
        return '<button class="chip' + (Number(cfg.rate) === r ? ' on' : '') + '" data-act="rate" data-id="' + r + '">' + r + 'x</button>';
      }).join('') + '</div></div></section>';
    if (!items.length) {
      h += state.listenMode === 'qa'
        ? '<div class="empty">ยังไม่มีข้อสอบในหัวข้อนี้ ให้ AI ออกข้อสอบได้ที่ 💬 ถาม AI > 🧠 AI ออกข้อสอบ</div>'
        : '<div class="empty">ยังไม่มีสรุปเนื้อหา<br>ไปที่ 💬 ถาม AI > 📂 เอกสาร แล้วกดประมวลผล AI จะสรุปให้อัตโนมัติ</div>';
      return h;
    }
    h += '<section class="card"><div class="qlist">' + items.map(function (it, i) {
      return '<button class="qitem' + (same && player.idx === i ? ' on' : '') + '" data-act="playAt" data-id="' + i + '" data-qi="' + i + '">' +
        '<span class="qn">' + (i + 1) + '</span><span class="grow"><span class="qt">' + esc(it.title) + '</span>' +
        '<span class="qx">' + br(it.text) + '</span>' +
        (it.answer ? '<span class="qt">เฉลย: ' + esc(it.answer) + '</span>' : '') + '</span></button>';
    }).join('') + '</div></section>';
    return h;
  }

  /* ---------- ข้อสอบ: หน้าแรก ---------- */
  function viewExam() {
    if (state.ses) return viewSession();
    let h = '<div class="seg">' + segBtn('examTab', 'start', '📝 เริ่มทำข้อสอบ', state.examTab === 'stats' ? 'stats' : 'start') +
      segBtn('examTab', 'stats', '📊 สถิติและประวัติ', state.examTab === 'stats' ? 'stats' : 'start') + '</div>';
    h += pendingBanner();
    h += state.examTab === 'stats' ? viewExamStats() : viewExamStart();
    return h;
  }

  function pendingBanner() {
    const n = pendingCount();
    if (!n) return '';
    return '<div class="banner"><div>☁️ มีผลสอบ ' + n + ' ชุดรอส่งขึ้น Google Sheet (ระบบส่งให้เองเมื่อออนไลน์)</div>' +
      (state.online ? '<button class="btn sm" data-act="sync">ส่งตอนนี้</button>' : '') + '</div>';
  }

  function modeBtn(id, title, sub) {
    return '<button class="mode' + (cfg.exMode === id ? ' on' : '') + '" data-act="exMode" data-id="' + id + '"><b>' + title + '</b><span>' + sub + '</span></button>';
  }

  function viewExamStart() {
    const topics = topicsOfAnn();
    const s = selectedTopics();
    const mode = cfg.exMode;
    const pool = questionsIn(s.tids);
    const wc = wrongCount(s.tids);
    const avail = mode === 'review' ? wc : pool.length;
    const count = examCount();
    const mins = examMinutes();
    const willGet = Math.min(count, avail);

    let h = '<section class="card"><h2>1. เลือกโหมด</h2><div class="mode-grid">' +
      modeBtn('practice', '✏️ ฝึกทำ', 'รู้ผลและเฉลยทันทีทุกข้อ') +
      modeBtn('mock', '⏱ จำลองสอบ', 'จับเวลา ส่งครั้งเดียว เหมือนสอบจริง') +
      modeBtn('review', '🔁 ทวนข้อผิด', 'เฉพาะข้อที่ตอบผิดครั้งล่าสุด (' + wc + ' ข้อ)') +
      '</div></section>';

    h += '<section class="card"><h2>2. เลือกหัวข้อ</h2><div class="chips">' +
      '<button class="chip' + (s.sel.length ? '' : ' on') + '" data-act="exTopic" data-id="all">ทุกหัวข้อ</button>' +
      topics.map(function (t) {
        return '<button class="chip' + (s.sel.indexOf(t.id) > -1 ? ' on' : '') + '" data-act="exTopic" data-id="' + esc(t.id) + '">' +
          esc(t.name) + ' (' + qsOf(t.id).length + ')</button>';
      }).join('') + '</div><div class="small muted mt">แตะได้หลายหัวข้อ</div></section>';

    h += '<section class="card"><h2>3. ตั้งค่า</h2>';
    h += '<div class="field"><span>จำนวนข้อ</span><div class="chips">' + [10, 20, 30, 50, 100].map(function (n) {
      return '<button class="chip' + (count === n ? ' on' : '') + '" data-act="exCountSet" data-id="' + n + '">' + n + '</button>';
    }).join('') + '<input class="inline-num" type="number" min="1" max="300" inputmode="numeric" data-change="exCount" value="' + count + '" aria-label="จำนวนข้อ"></div></div>';
    if (mode === 'mock') {
      h += '<div class="field"><span>เวลา (นาที)</span><div class="chips">' + [15, 30, 45, 60, 90, 120].map(function (n) {
        return '<button class="chip' + (mins === n ? ' on' : '') + '" data-act="exMinSet" data-id="' + n + '">' + n + '</button>';
      }).join('') + '<input class="inline-num" type="number" min="1" max="300" inputmode="numeric" data-change="exMin" value="' + mins + '" aria-label="เวลา"></div>' +
        (willGet ? '<div class="small muted mt">เฉลี่ยประมาณ ' + Math.round(mins * 60 / willGet) + ' วินาทีต่อข้อ</div>' : '') + '</div>';
    }
    if (mode === 'practice') {
      h += '<label class="switch"><input type="checkbox" data-change="exSmart"' + (cfg.exSmart ? ' checked' : '') + '>' +
        '<span>เน้นข้อที่ยังไม่เคยทำ และข้อที่เคยตอบผิด</span></label>';
    }
    if (avail) {
      h += '<div class="banner"><div>จะได้ข้อสอบ <b>' + willGet + '</b> ข้อ จากที่มี ' + avail + ' ข้อ' +
        (mode === 'mock' ? ' · เวลา <b>' + mins + '</b> นาที' : '') + '</div></div>';
    } else {
      h += '<div class="banner"><div>' + (mode === 'review' ? 'ไม่มีข้อที่ต้องทวนในหัวข้อที่เลือก 👍' : 'ยังไม่มีข้อสอบในหัวข้อที่เลือก ลองให้ AI ออกข้อสอบที่แท็บ 💬') + '</div></div>';
    }
    h += '<button class="btn primary block" data-act="startExam"' + (avail ? '' : ' disabled') + '>🚀 เริ่มทำข้อสอบ</button></section>';
    return h;
  }

  /* ---------- ข้อสอบ: ระหว่างทำ ---------- */
  function feedbackBox(q, chosen) {
    const ok = chosen === String(q.answer);
    const ai = LETTERS.indexOf(String(q.answer));
    return '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? '✅ ถูกต้อง' : '❌ ยังไม่ถูก · เฉลยคือข้อ ' + esc(q.answer)) + '</b>' +
      (!ok && ai > -1 ? '<div>' + br(q[KEYS[ai]]) + '</div>' : '') +
      (q.explanation ? '<div class="mt">💡 ' + br(q.explanation) + '</div>' : '') +
      (q.reference ? '<div class="small muted mt">อ้างอิง: ' + esc(q.reference) + '</div>' : '') +
      '<div class="row wrap mt"><button class="btn sm" data-act="speakExp" data-id="' + esc(q.id) + '">🔊 ฟังเฉลย</button>' +
      '<button class="btn sm danger" data-act="flagQ" data-id="' + esc(q.id) + '">⚠️ แจ้งข้อนี้ผิด</button></div></div>';
  }

  function viewSession() {
    const s = state.ses;
    if (s.cur >= s.qs.length) s.cur = s.qs.length - 1;
    const q = s.qs[s.cur];
    const chosen = s.answers[q.id] || '';
    const instant = s.mode !== 'mock';
    const reveal = instant && !!chosen;
    const nAns = answeredCount(s);
    const nOk = s.qs.filter(function (x) { return s.answers[x.id] && s.answers[x.id] === String(x.answer); }).length;
    const t = topicById(q.topic_id);

    let h = '<section class="card"><div class="row between wrap"><div><b>' + MODE_LABEL[s.mode] + '</b>' +
      ' <span class="muted">· ข้อ ' + (s.cur + 1) + '/' + s.qs.length + '</span></div>';
    if (s.mode === 'mock') h += '<div id="exTimer" class="timer' + (timeLeft(s) <= 300 ? ' warn' : '') + '">' + fmtClock(timeLeft(s)) + '</div>';
    else h += '<div class="small">✅ ถูก <b>' + nOk + '</b> / ตอบ ' + nAns + '</div>';
    h += '</div><div class="progress"><i style="width:' + Math.round(nAns * 100 / s.qs.length) + '%"></i></div></section>';

    h += '<section class="card"><div class="row"><div class="grow small muted">' + esc(t ? t.name : '') + '</div>' +
      '<button class="icon-btn sm" data-act="speakQ" aria-label="อ่านโจทย์">🔊</button>' +
      (s.mode === 'mock' ? '<button class="icon-btn sm" data-act="markQ" aria-label="ทำเครื่องหมาย">' + (s.marks[q.id] ? '★' : '☆') + '</button>' : '') +
      '</div><div class="qtext">' + (s.cur + 1) + '. ' + br(q.question) + '</div>';
    KEYS.forEach(function (k, i) {
      if (!q[k]) return;
      const L = LETTERS[i];
      let c = 'opt';
      if (reveal) {
        if (L === String(q.answer)) c += ' correct';
        else if (L === chosen) c += ' wrong';
      } else if (L === chosen) c += ' sel';
      h += '<button class="' + c + '" data-act="pick" data-id="' + L + '"' + (reveal ? ' disabled' : '') + '>' +
        '<span class="ol">' + L + '</span><span class="grow">' + br(q[k]) + '</span></button>';
    });
    if (reveal) h += feedbackBox(q, chosen);
    h += '<div class="row between wrap mt"><button class="btn" data-act="sesNav" data-id="-1"' + (s.cur === 0 ? ' disabled' : '') + '>‹ ก่อนหน้า</button>';
    if (s.cur + 1 < s.qs.length) h += '<button class="btn primary" data-act="sesNav" data-id="1">ถัดไป ›</button>';
    else h += '<button class="btn primary" data-act="finish">' + (s.mode === 'mock' ? '🏁 ส่งข้อสอบ' : '🏁 ดูผล') + '</button>';
    h += '</div></section>';

    h += '<section class="card"><button class="btn ghost sm block" style="justify-content:flex-start" data-act="toggleGrid">' +
      (state.gridOpen ? '▾' : '▸') + ' ภาพรวมทุกข้อ (ตอบแล้ว ' + nAns + '/' + s.qs.length + ')</button>';
    if (state.gridOpen) {
      h += '<div class="qgrid">' + s.qs.map(function (x, i) {
        let c = 'qg';
        const a = s.answers[x.id];
        if (a) c += instant ? (a === String(x.answer) ? ' ok' : ' bad') : ' ans';
        if (s.marks[x.id]) c += ' mk';
        if (i === s.cur) c += ' cur';
        return '<button class="' + c + '" data-act="jump" data-id="' + i + '">' + (i + 1) + '</button>';
      }).join('') + '</div>';
    }
    h += '<div class="row wrap mt">' +
      (s.mode === 'mock' ? '<button class="btn primary" data-act="finish">🏁 ส่งข้อสอบ</button>' : '<button class="btn" data-act="finish">🏁 จบและดูผล</button>') +
      '<button class="btn danger" data-act="discard">🗑 ทิ้งชุดนี้</button></div>';
    if (s.mode === 'mock') h += '<p class="small muted">⏱ เวลาเดินต่อแม้สลับไปหน้าอื่นหรือปิดแอป เหมือนสอบจริง · แตะ ☆ เพื่อทำเครื่องหมายข้อที่ไม่แน่ใจ</p>';
    else h += '<p class="small muted">พักไว้ได้ สลับไปหน้าอื่นแล้วกลับมาที่แท็บ 📝 จะทำต่อจากข้อเดิม</p>';
    h += '</section>';
    return h;
  }

  /* ---------- ข้อสอบ: หน้าสรุปผล ---------- */
  function viewResult() {
    const r = state.res;
    if (!r) { state.view = 'exam'; return viewExam(); }
    const a = r.attempt;
    const pass = Number(a.score) >= passPct();
    const am = {};
    (a.answers || []).forEach(function (x) { am[x.qid] = x; });
    const wrongQs = r.
