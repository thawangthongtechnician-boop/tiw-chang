<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ติวช่าง">
<title>ติวหัวหน้าฝ่ายช่าง</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="appleIcon" href="icon.svg">
<style>
:root{--primary:#1e3a8a;--accent:#2563eb;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#eef2ff;--bad:#dc2626;--ok:#16a34a;--r:16px;--tab:64px;--side:96px}
[data-theme="dark"]{--bg:#0b1220;--card:#121a2b;--text:#e5e7eb;--muted:#94a3b8;--line:#243049;--soft:#1b2540;--accent:#60a5fa;--ok:#22c55e;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Thonburi","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--primary);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;min-width:0}
.brand .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:6px}
.topbar .icon-btn{color:#fff;background:rgba(255,255,255,.14)}
.pill{font-size:.75rem;padding:2px 10px;border-radius:999px;background:#f59e0b;color:#111;font-weight:700}
main{max-width:980px;margin:0 auto;padding:16px 14px calc(var(--tab) + 24px + env(safe-area-inset-bottom))}
body.has-mini main{padding-bottom:calc(var(--tab) + 100px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:1.2rem}
.narrow{max-width:520px;margin:24px auto}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mt{margin-top:12px}
.mb{margin-bottom:12px}
.center{text-align:center}
.sec{margin:20px 4px 10px;font-size:1.05rem}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:var(--soft);cursor:pointer;font-size:1.15rem;flex:none}
.icon-btn.sm{width:38px;height:38px;font-size:1rem}
.icon-btn.lg{width:52px;height:52px;font-size:1.3rem}
.spin span{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.field input,.field select,.big-select,.search{width:100%;min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.big-select{font-weight:700;font-size:1.05rem;margin:4px 0 12px}
.mini-sel{min-height:36px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.msg{min-height:1.2em;margin:8px 0;font-size:.9rem}
.msg.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--accent)}
.stat span{font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r);padding:14px;cursor:pointer;width:100%}
.tname{font-weight:700;font-size:1.05rem}
.tdesc{color:var(--muted);font-size:.9rem}
.tmeta{display:flex;gap:14px;font-size:.85rem;color:var(--muted);margin-top:auto}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0 12px;cursor:pointer;font-size:1rem}
.doc-head{display:flex;gap:12px;align-items:center}
.dicon{font-size:1.6rem}
.dtitle{font-weight:600}
.home-docs{border-left:5px solid #f59e0b}
.badge{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--soft)}
.badge.ok{background:#dcfce7;color:#166534}
.badge.wait{background:#fef3c7;color:#92400e}
.badge.bad{background:#fee2e2;color:#991b1b}
.slist{list-style:none;margin:10px 0 0;padding:0}
.slist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.slist li:last-child{border-bottom:0}
.num,.qn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);margin-bottom:14px}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:0 0 14px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--accent)}
.player{margin-top:10px;padding:14px;border-radius:14px;background:var(--soft)}
.pnow{text-align:center;font-weight:600;min-height:1.6em}
.pctrl{display:flex;justify-content:center;align-items:center;gap:14px;margin:10px 0}
.play{width:68px;height:68px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:1.6rem;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;min-height:38px;cursor:pointer;font-size:.92rem}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.spd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.spd .row{margin-bottom:8px}
input[type=range]{flex:1;width:100%;min-width:0;height:34px;accent-color:var(--primary)}
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{display:flex;gap:10px;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;width:100%}
.qitem.on{background:var(--soft);border-color:var(--accent)}
.qitem.on .qn{background:var(--accent);color:#fff}
.qt{display:block;font-size:.8rem;color:var(--muted)}
.qx{display:block}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.mode span{font-size:.82rem;color:var(--muted)}
.mode.on{border-color:var(--accent);background:var(--soft)}
.inline-num{width:96px;min-height:38px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.switch{display:flex;gap:10px;align-items:center;cursor:pointer;margin:12px 0}
.switch input{width:22px;height:22px;flex:none}
.progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;background:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.25rem;padding:2px 12px;border-radius:10px;background:var(--soft)}
.timer.warn{background:#fee2e2;color:#991b1b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.qtext{font-size:1.12rem;font-weight:600;margin:6px 0 14px;line-height:1.75}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;min-height:56px}
.opt .ol{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.sel .ol{background:var(--accent);color:#fff}
.opt.correct{border-color:var(--ok);background:rgba(22,163,74,.12)}
.opt.correct .ol{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:rgba(220,38,38,.10)}
.opt.wrong .ol{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1;color:inherit}
.fb{border-radius:14px;padding:12px 14px;margin-top:4px;background:var(--soft);border-left:5px solid var(--accent)}
.fb.ok{border-left-color:var(--ok)}
.fb.bad{border-left-color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:10px}
.qg{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;position:relative}
.qg.ans{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.qg.ok{background:rgba(22,163,74,.15);border-color:var(--ok);color:var(--ok)}
.qg.bad{background:rgba(220,38,38,.12);border-color:var(--bad);color:var(--bad)}
.qg.cur{outline:3px solid var(--accent);outline-offset:1px}
.qg.mk::after{content:'★';position:absolute;top:-8px;right:-4px;font-size:.8rem;color:#f59e0b}
.big-score{font-size:3.2rem;font-weight:800;line-height:1.15}
.pass{color:var(--ok)}
.fail{color:var(--bad)}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.trow{padding:12px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.hrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.score-pill{flex:none;min-width:66px;text-align:center;font-weight:800;border-radius:999px;padding:4px 10px}
.score-pill.pass{background:rgba(22,163,74,.15)}
.score-pill.fail{background:rgba(220,38,38,.12)}
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-pass{stroke:var(--ok);stroke-width:2;stroke-dasharray:6 6}
.ch-line{fill:none;stroke:var(--accent);stroke-width:3}
.ch-dot{fill:var(--card);stroke:var(--accent);stroke-width:3}
.ch-txt{fill:var(--muted);font-size:12px}
.rv{border-top:1px solid var(--line);padding:14px 0}
.rv:first-child{border-top:0;padding-top:0}
.rv .opt{min-height:0;padding:8px 10px;margin-bottom:6px;cursor:default}
.rv .qtext{font-size:1rem}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub{max-width:92%;padding:10px 14px;border-radius:16px;line-height:1.7;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.bub.err{align-self:flex-start;background:rgba(220,38,38,.10);color:var(--bad)}
.bub .li{padding-left:4px}
.bub .sp{height:6px}
.meta{font-size:.78rem;color:var(--muted);margin-top:6px}
.typing span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:52px;max-height:200px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);resize:vertical}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
.send{background:var(--primary);color:#fff}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tab);border:0;background:none;cursor:pointer;color:var(--muted)}
.tab .ti{font-size:1.3rem;line-height:1}
.tab .tl{font-size:.72rem}
.tab.on{color:var(--accent);font-weight:700}
#mini{position:fixed;left:10px;right:10px;bottom:calc(var(--tab) + 8px + env(safe-area-inset-bottom));z-index:29;display:flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border-radius:16px;padding:6px 8px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:760px;margin:0 auto}
#mini .icon-btn{background:rgba(255,255,255,.15);color:#fff}
.mtext{flex:1;min-width:0;text-align:left;border:0;background:none;color:#fff;cursor:pointer;display:flex;flex-direction:column}
.mtext b,.mtext span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtext span{font-size:.8rem;opacity:.85}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 100px);transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw;text-align:center;font-size:.92rem}
#toast.show{opacity:1}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.mode-grid{grid-template-columns:1fr}}
@media (min-width:900px){
  body.has-tabs{padding-left:var(--side)}
  .tabbar{top:0;bottom:0;right:auto;width:var(--side);flex-direction:column;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 12px);border-top:0;border-right:1px solid var(--line)}
  .tab{flex:none;height:80px}
  main,body.has-mini main{padding-bottom:110px}
  #mini{left:calc(var(--side) + 16px);bottom:16px}
  #toast{bottom:100px}
}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main id="main"></main>
<div id="mini" hidden></div>
<nav class="tabbar" id="tabbar" hidden></nav>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  const APP_VERSION = '5.0.0';
  const NL = String.fromCharCode(10);
  const K_CFG = 'tiw_cfg';
  const K_DATA = 'tiw_data';
  const K_HIDE = 'tiw_hide_install';
  const K_LOCAL = 'tiw_attempts';
  const K_FLAGS = 'tiw_flags';
  const K_SES = 'tiw_session';
  const K_CHAT = 'tiw_chat2';
  const LETTERS = ['ก', 'ข', 'ค', 'ง'];
  const KEYS = ['a', 'b', 'c', 'd'];
  const MODE_LABEL = { practice: 'ฝึกทำ', mock: 'จำลองสอบ', review: 'ทวนข้อผิด' };
  const AI_STOP = ['QUOTA', 'NO_KEY', 'BAD_KEY'];
  const POINT_OPTS = [5, 8, 10, 12, 15, 20, 25, 30, 40, 50, 60];
  const DETAILS = ['สั้น', 'ปกติ', 'ละเอียด'];
  const SUGGEST = ['สรุปประเด็นสำคัญที่มักออกสอบ', 'มีตัวเลขหรือระยะเวลาอะไรที่ต้องจำบ้าง',
    'อธิบายให้เข้าใจง่ายเหมือนสอนมือใหม่', 'ยกตัวอย่างสถานการณ์ที่อาจออกเป็นข้อสอบ'];
  const FOLLOW = ['ขยายความเพิ่มอีกหน่อย', 'ยกตัวอย่างประกอบ', 'สรุปสั้น ๆ ให้จำง่าย', 'มีข้อยกเว้นหรือจุดที่มักออกสอบไหม'];

  const DEFAULT_CFG = { apiUrl: '', pin: '', annId: '', theme: 'auto', font: 'normal',
    rate: 1, pitch: 1, voice: '', allVoices: false, qaPause: 5,
    exMode: 'practice', exTopics: [], exCount: 0, exMin: 0, exSmart: true,
    chatTopic: 'all', aiGeneral: false, ansLen: 'ปกติ', autoSpeak: 'voice', autoSend: true,
    genTopic: '', genCount: 10, genDiff: 'กลาง', sumPoints: 12, sumDetail: 'ปกติ' };

  let toastTimer = null, examTimer = null, advTimer = null, rateTimer = null;
  let syncPromise = null, recog = null, wakeLock = null;
  let cfg = Object.assign({}, DEFAULT_CFG, loadJSON(K_CFG, {}));
  cfg.rate = clampRate(cfg.rate);
  cfg.pitch = clampRate(cfg.pitch);
  if (!Array.isArray(cfg.exTopics)) cfg.exTopics = [];
  if (!MODE_LABEL[cfg.exMode]) cfg.exMode = 'practice';
  let data = loadJSON(K_DATA, null);
  const state = { view: 'home', topicId: '', listenTopic: 'all', listenMode: 'summary',
    syncing: false, online: navigator.onLine, installEvt: null,
    examTab: 'start', ses: loadJSON(K_SES, null), res: null, gridOpen: false,
    aiTab: 'chat', chatBusy: false, chatStart: 0, chatDraft: '', listening: false, voiceAsked: false,
    genBusy: false, genStart: 0, genMsg: '', genResult: null, aiMsg: '',
    busy: {}, queue: [], qRunning: false, docQ: '', docTopic: 'all', openDoc: '' };
  if (state.ses && (!Array.isArray(state.ses.qs) || !state.ses.qs.length)) state.ses = null;
  const player = { queue: [], key: '', idx: 0, chunkIdx: 0, playing: false, done: false, token: 0, timer: null };
  const hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);

  /* =========== ตัวช่วยทั่วไป =========== */
  function byId(id) { return document.getElementById(id); }
  function loadJSON(k, d) {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; }
  }
  function saveJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { toast('พื้นที่เก็บข้อมูลในเครื่องเต็ม'); return false; }
  }
  function saveCfg() { saveJSON(K_CFG, cfg); }
  function saveData() { if (data) saveJSON(K_DATA, data); }
  function clampRate(v) { return Math.round(Math.max(0.5, Math.min(2, Number(v) || 1)) * 100) / 100; }
  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;')
      .split('"').join('&quot;').split("'").join('&#39;');
  }
  function br(s) { return esc(s).split(NL).join('<br>'); }
  function shortText(s, n) {
    s = String(s || '').split(NL).join(' ');
    return s.length > n ? s.slice(0, n) + '…' : s;
  }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function round1(v) { return Math.round((Number(v) || 0) * 10) / 10; }
  function secs(t0) { return Math.round((Date.now() - t0) / 1000); }
  function fmtDate(v) {
    if (!v) return '-';
    const d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ':' + pad2(m) : pad2(m)) + ':' + pad2(s);
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m ? m + ' นาที' + (s ? ' ' + s + ' วินาที' : '') : s + ' วินาที';
  }
  function toast(msg) {
    const t = byId('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);

  }

  function chunkText(text) {
    const out = [];
    String(text || '').split(NL).forEach(function (line) {
      let cur = '';
      line.split(' ').forEach(function (w) {
        if (!w) return;
        while (w.length > 200) {
          if (cur) { out.push(cur); cur = ''; }
          out.push(w.slice(0, 200));
          w = w.slice(200);
        }
        if (!w) return;
        if (cur && (cur.length + w.length + 1) > 140) { out.push(cur); cur = w; }
        else cur = cur ? cur + ' ' + w : w;
      });
      if (cur) out.push(cur);
    });
    return out;
  }
  function qaChunks(q) {
    let c = chunkText('คำถาม. ' + q.question);

    c.push((Number(cfg.qaPause) || 5) * 1000);
    const ai = LETTERS.indexOf(String(q.answer));
    c = c.concat(chunkText('เฉลย ข้อ ' + q.answer + (ai > -1 && q[KEYS[ai]] ? '. ' + q[KEYS[ai]] : '')));

    return c;

  function buildQueue(mode, tkey) {

      const t = topicById(tid);

      } else {

  }

  function startSpeak(tk) {
    if (!hasTTS()) { toast('เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน'); player.playing = false; updatePlayerUI(); return; }
    clearTimeout(player.timer);

    if (tk !== player.token || !player.playing) return;

    if (player.chunkIdx >= item.chunks.length) {
      if (player.idx + 1 < player.queue.length) {
        player.idx++;
        player.chunkIdx = 0;
        updatePlayerUI();
        player.timer = setTimeout(function () { speakChunk(tk); }, 600);
      } else finishAll();
      return;
    }
    const c = item.chunks[player.chunkIdx];
    if (typeof c === 'number') {
      player.timer = setTimeout(function () { if (tk === player.token) { player.chunkIdx++; speakChunk(tk); } }, c);
      return;
    }
    const u = new SpeechSynthesisUtterance(c);

    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'th-TH';

  /* =========== ระบบข้อสอบ =========== */
  function saveSession() { if (state.ses) saveJSON(K_SES, state.ses); }
  function timeLeft(s) { return Math.max(0, Math.round((s.endAt - Date.now()) / 1000)); }
  function answeredCount(s) { return s.qs.filter(function (q) { return s.answers[q.id]; }).length; }
  function smartPick(pool, st) {
    const arr = shuffle(pool);
    const pri = {};
    arr.forEach(function (q) {
      const s = st[q.id] || { n: 0, w: 0, last: '' };
      let p = 0;
      if (s.last === 'ผิด') p += 3;
      if (!s.n) p += 2;
      if (s.n) p += s.w / s.n;
      pri[q.id] = p;
    });
    return arr.sort(function (a, b) { return pri[b.id] - pri[a.id]; });
  }
  function startSession(o) {
    const st = qStats();
    let pool = o.qs ? o.qs.slice() : questionsIn(o.tids || []);
    if (o.mode === 'review' && !o.qs) pool = pool.filter(function (q) { return (st[q.id] || {}).last === 'ผิด'; });
    if (!pool.length) { toast(o.mode === 'review' ? 'ไม่มีข้อที่ต้องทวนแล้ว เยี่ยมมาก 👍' : 'ไม่มีข้อสอบตามเงื่อนไขที่เลือก'); return; }
    let qs = (o.mode === 'practice' && o.smart && !o.qs) ? smartPick(pool, st) : shuffle(pool);
    qs = qs.slice(0, Math.max(1, Math.min(Number(o.count) || qs.length, qs.length)));
    const now = Date.now();
    const min = Math.max(1, Number(o.minutes) || 30);
    state.ses = { id: newId(), mode: o.mode, qs: qs.map(snapQ), cur: 0, answers: {}, marks: {},
      startAt: now, limitMin: o.mode === 'mock' ? min : 0, endAt: o.mode === 'mock' ? now + min * 60000 : 0 };
    state.gridOpen = o.mode === 'mock';
    saveSession();
    startTimer();
    goTo('exam');
  }
  function endSession() {
    clearInterval(examTimer);
    clearTimeout(advTimer);
    state.ses = null;
    localStorage.removeItem(K_SES);
  }
  function guardSession() {
    if (!state.ses) return true;
    if (!window.confirm('มีข้อสอบที่ทำค้างอยู่ ต้องการทิ้งชุดเดิมแล้วเริ่มชุดใหม่?')) return false;
    endSession();
    return true;
  }
  function startTimer() {
    clearInterval(examTimer);
    if (!state.ses || state.ses.mode !== 'mock') return;
    examTimer = setInterval(tick, 1000);
    tick();
  }
  function tick() {
    const s = state.ses;
    if (!s || s.mode !== 'mock') { clearInterval(examTimer); return; }
    const left = timeLeft(s);
    const el = byId('exTimer');
    if (el) { el.textContent = fmtClock(left); el.classList.toggle('warn', left <= 300); }
    if (left <= 0) { clearInterval(examTimer); finishSession(true); }
  }
  function finishSession(auto) {
    const s = state.ses;
    if (!s) return;
    clearInterval(examTimer);
    clearTimeout(advTimer);
    const isMock = s.mode === 'mock';
    const items = s.qs.filter(function (q) { return isMock || s.answers[q.id]; });
    if (!items.length) { endSession(); toast('ยังไม่ได้ตอบข้อใด จึงไม่บันทึกผล'); goTo('exam'); return; }
    const answers = items.map(function (q) {
      const chosen = s.answers[q.id] || '';
      return { qid: q.id, chosen: chosen, correct: chosen === String(q.answer) };
    });
    const correct = answers.filter(function (x) { return x.correct; }).length;
    const endTime = isMock ? Math.min(Date.now(), s.endAt) : Date.now();
    const tids = [];
    items.forEach(function (q) { if (tids.indexOf(q.topic_id) === -1) tids.push(q.topic_id); });
    const attempt = { id: s.id, date: new Date().toISOString(), mode: MODE_LABEL[s.mode], topic_ids: tids,
      total: items.length, correct: correct, score: round1(correct * 100 / items.length),
      time_used: Math.round((endTime - s.startAt) / 1000), time_limit: isMock ? s.limitMin : '',
      answers: answers, synced: false };
    const cur = localAttempts();
    cur.push(attempt);
    saveLocal(cur);
    endSession();
    state.res = { attempt: attempt, qs: items, filter: 'all' };
    goTo('result');
    if (auto) toast('⏰ หมดเวลา ระบบส่งข้อสอบให้อัตโนมัติ');
    syncAll().catch(function () { /* ส่งรอบหน้า */ });
  }

  /* =========== AI: เอกสาร =========== */
  function docPoints(d) { return Number(d.sum_points) || cfg.sumPoints; }
  function docDetail(d) { return DETAILS.indexOf(d.sum_detail) > -1 ? d.sum_detail : cfg.sumDetail; }
  function queueDoc(id, reextract) {
    if (state.busy[id]) return;
    if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ต'); return; }
    if (!aiInfo().hasKey) { toast('ยังไม่ได้ตั้งคีย์ Gemini'); return; }
    state.queue.push({ id: id, reextract: !!reextract });
    state.busy[id] = '⏳ รอคิว...';
    refreshDocsUI();
    runQueue();
  }
  function setBusy(id, m) {
    state.busy[id] = m;
    const el = byId('busy-' + id);
    if (el) el.textContent = m;
  }
  function runQueue() {
    if (state.qRunning || !state.queue.length) return;
    state.qRunning = true;
    keepAwake(true);
    const job = state.queue.shift();
    const d = docById(job.id);
    if (!d) { delete state.busy[job.id]; state.qRunning = false; runQueue(); return; }
    const t0 = Date.now();
    const pts = docPoints(d);
    const det = docDetail(d);
    const label = (job.reextract || !d.text_file_id) ? 'อ่านไฟล์และสรุป' : 'AI กำลังสรุป ' + pts + ' ข้อ (' + det + ')';
    setBusy(job.id, '⏳ ' + label + '... 0 วิ');
    const tm = setInterval(function () { setBusy(job.id, '⏳ ' + label + '... ' + secs(t0) + ' วิ'); }, 1000);
    api('processDoc', { id: job.id, points: pts, detail: det, reextract: job.reextract }, 340000).then(function (r) {
      Object.assign(d, r.doc);
      data.summaries = list('summaries').filter(function (s) { return s.doc_id !== d.id; }).concat(r.summaries || []);
      saveData();
      toast('✅ ' + shortText(d.title, 30) + ': สรุป ' + (r.summaries || []).length + ' ข้อ (' + secs(t0) + ' วิ)');
    }).catch(function (err) {
      d.note = err.message;
      if (AI_STOP.indexOf(err.code) > -1) {
        state.queue.forEach(function (j) { delete state.busy[j.id]; });
        state.queue = [];
      } else d.status = 'ผิดพลาด';
      saveData();
      toast('⚠️ ' + err.message);
    }).then(function () {
      clearInterval(tm);
      delete state.busy[job.id];
      state.qRunning = false;
      keepAwake(false);
      refreshDocsUI();
      runQueue();
    });
  }
  function refreshDocsUI() {
    if (state.view !== 'docs' && state.view !== 'topic') return;
    if (isTyping()) { const el = byId('docList'); if (el && state.view === 'docs') el.innerHTML = docListHtml(); }
    else render();
  }

  /* =========== AI: แชต =========== */
  function chatState() {
    const c = loadJSON(K_CHAT, null);
    return (c && Array.isArray(c.msgs)) ? c : { cid: '', msgs: [] };
  }
  function saveChat(c) { c.msgs = c.msgs.slice(-60); saveJSON(K_CHAT, c); }
  function chatTopicIds() {
    const topics = topicsOfAnn();
    if (cfg.chatTopic !== 'all' && topics.some(function (t) { return t.id === cfg.chatTopic; })) return [cfg.chatTopic];
    return topics.map(function (t) { return t.id; });
  }
  function scrollEnd() { setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 40); }
  function mdLite(s) {
    return String(s || '').split(NL).map(function (line) {
      let t = line.trim();
      if (!t) return '<div class="sp"></div>';
      let bullet = false;
      if (t.charAt(0) === '#') {
        while (t.charAt(0) === '#') t = t.slice(1);
        t = '**' + t.trim() + '**';
      }
      if (t.indexOf('- ') === 0 || t.indexOf('* ') === 0 || t.indexOf('• ') === 0) { bullet = true; t = t.slice(2); }
      const html = esc(t).split('**').map(function (p, i) { return i % 2 ? '<b>' + p + '</b>' : p; }).join('');
      return bullet ? '<div class="li">• ' + html + '</div>' : '<div>' + html + '</div>';
    }).join('');
  }
  function plainText(s) {
    return String(s || '').split('**').join('').split(NL).map(function (l) {
      let t = l.trim();
      while (t.charAt(0) === '#') t = t.slice(1);
      t = t.trim();
      if (t.indexOf('- ') === 0 || t.indexOf('* ') === 0 || t.indexOf('• ') === 0) t = t.slice(2);
      return t;
    }).filter(function (t) { return t; }).join(NL);
  }
  function sendChat(text) {
    const box = byId('chatIn');
    const q = String(text || (box ? box.value : '') || '').trim();
    if (!q || state.chatBusy) return;
    if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ตเพื่อถาม AI'); return; }
    const voice = state.voiceAsked;
    state.voiceAsked = false;
    const c = chatState();
    if (!c.cid) c.cid = newId();
    const hist = c.msgs.filter(function (m) { return !m.err; }).slice(-6)
      .map(function (m) { return { role: m.role, text: String(m.text).slice(0, 1200) }; });
    c.msgs.push({ role: 'user', text: q, t: Date.now() });
    saveChat(c);
    state.chatDraft = '';
    state.chatBusy = true;
    state.chatStart = Date.now();
    pauseSpeech();
    render();
    scrollEnd();
    const tm = setInterval(function () { const el = byId('thinkT'); if (el) el.textContent = secs(state.chatStart) + ' วิ'; }, 500);
    api('chat', { question: q, topic_ids: chatTopicIds(), history: hist, allowGeneral: !!cfg.aiGeneral,
      length: cfg.ansLen, cid: c.cid }, 120000).then(function (d) {
      const c2 = chatState();
      c2.msgs.push({ role: 'model', text: d.answer, sources: d.sources || [], t: Date.now(),
        ms: Date.now() - state.chatStart, model: d.model || '', reused: !!d.reused });
      saveChat(c2);
      if (cfg.autoSpeak === 'always' || (cfg.autoSpeak === 'voice' && voice)) speakText('chat' + Date.now(), 'คำตอบ AI', plainText(d.answer));
    }).catch(function (err) {
      const c2 = chatState();
      c2.msgs.push({ role: 'model', text: '⚠️ ' + err.message, err: true, t: Date.now() });
      saveChat(c2);
    }).then(function () {
      clearInterval(tm);
      state.chatBusy = false;
      if (state.view === 'chat') { render(); scrollEnd(); }
    });
  }
  function updateMicBtn() { const b = byId('micBtn'); if (b) b.classList.toggle('on', state.listening); }
  function toggleMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      toast('เครื่องนี้ใช้ไมค์ในแอปไม่ได้ ให้แตะช่องพิมพ์ แล้วกด 🎤 บนแป้นพิมพ์แทน');
      const b0 = byId('chatIn');
      if (b0) b0.focus();
      return;
    }
    if (state.listening && recog) { recog.stop(); return; }
    if (state.chatBusy) return;
    pauseSpeech();
    const box = byId('chatIn');
    const base = box && box.value.trim() ? box.value.trim() + ' ' : '';
    let finalText = '';
    recog = new SR();
    recog.lang = 'th-TH';
    recog.interimResults = true;
    recog.continuous = false;
    recog.onresult = function (ev) {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript; else interim += ev.results[i][0].transcript;
      }
      const b = byId('chatIn');
      if (b) b.value = base + finalText + interim;
      state.chatDraft = base + finalText + interim;
    };
    recog.onerror = function (ev) {
      state.listening = false;
      updateMicBtn();
      const e = ev && ev.error;
      if (e === 'not-allowed' || e === 'service-not-allowed') toast('ไม่ได้รับอนุญาตใช้ไมค์ ให้กด 🎤 บนแป้นพิมพ์แทน');
      else if (e === 'no-speech') toast('ไม่ได้ยินเสียง ลองพูดใหม่อีกครั้ง');
      else if (e && e !== 'aborted') toast('ไมค์มีปัญหา (' + e + ') ให้กด 🎤 บนแป้นพิมพ์แทน');
    };
    recog.onend = function () {
      state.listening = false;
      updateMicBtn();
      const b = byId('chatIn');
      const t = b ? b.value.trim() : '';
      if (finalText.trim() && t && cfg.autoSend) { state.voiceAsked = true; sendChat(t); }
    };
    try {
      recog.start();
      state.listening = true;
      updateMicBtn();
      toast('🎤 พูดได้เลย');
    } catch (e) {
      state.listening = false;
      toast('เปิดไมค์ไม่ได้ ให้กด 🎤 บนแป้นพิมพ์แทน');
    }
  }

  }
  function docCard(d) {
    const sums = docSums(d.id);

    const done = d.status === 'ประมวลผลแล้ว';
    const pts = docPoints(d);

      '<div class="dtitle">' + esc(d.title || '(ไม่มีชื่อ)') + '</div><div class="small muted">' + statusBadge(d.status) +
      (d.char_count ? ' · ' + Math.round(Number(d.char_count) / 1000) + 'k ตัวอักษร' : '') + (sums.length ? ' · สรุป ' + sums.length + ' ข้อ' : '') + '</div></div>' +
      (d.open_url ? '<button class="btn sm" data-act="openDoc" data-id="' + esc(d.id) + '">เปิดไฟล์ ↗</button>' : '') + '</div>';
    if (d.note) h += '<div class="small muted mt">' + br(d.note) + '</div>';
    if (sums.length) {
      h += '<div class="row wrap mt"><button class="btn sm primary" data-act="listenDoc" data-id="' + esc(d.id) + '">🎧 ฟังสรุป</button>' +
        '<button class="btn sm" data-act="toggleDoc" data-id="' + esc(d.id) + '">' + (open ? '▾ ซ่อนสรุป' : '▸ อ่านสรุป') + '</button></div>';
    }
    h += '<div class="row wrap mt small"><span>จำนวนสรุป</span><select class="mini-sel" data-change="docPoints" data-id="' + esc(d.id) + '">' +
      opts.map(function (n) { return '<option value="' + n + '"' + (n === pts ? ' selected' : '') + '>' + n + ' ข้อ</option>'; }).join('') + '</select>' +
      '<span>ระดับ</span><select class="mini-sel" data-change="docDetail" data-id="' + esc(d.id) + '">' +
      DETAILS.map(function (x) { return '<option' + (x === det ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' +
      '<button class="btn sm' + (done ? '' : ' primary') + '" data-act="runDoc" data-id="' + esc(d.id) + '"' + (busy ? ' disabled' : '') + '>' + (done ? '🔄 สรุปใหม่' : '🤖 ประมวลผล') + '</button>' +
      (done ? '<button class="btn sm ghost" data-act="reExtract" data-id="' + esc(d.id) + '"' + (busy ? ' disabled' : '') + '>อ่านไฟล์ใหม่</button>' : '') + '</div>';

  /* ---------- เอกสารประกอบการเตรียมสอบ ---------- */
  function docMatch(d, q) {
    if (String(d.title || '').toLowerCase().indexOf(q) > -1) return true;
    return docSums(d.id).some(function (s) { return String(s.text).toLowerCase().indexOf(q) > -1; });
  }
  function docListHtml() {
    const q = state.docQ.trim().toLowerCase();
    const groups = topicsOfAnn().map(function (t) { return { id: t.id, name: t.name }; }).concat([{ id: '', name: 'ยังไม่ระบุหัวข้อ' }]);
    const all = libDocs();
    let h = '';
    groups.forEach(function (g) {
      if (state.docTopic !== 'all' && state.docTopic !== g.id) return;
      const ds = all.filter(function (d) { return (d.topic_id || '') === g.id && (!q || docMatch(d, q)); });
      if (ds.length) h += '<h3 class="sec">' + esc(g.name) + ' (' + ds.length + ')</h3>' + ds.map(docCard).join('');
    });
    return h || '<div class="empty">' + (q ? 'ไม่พบเอกสารที่ตรงกับ "' + esc(state.docQ) + '"' : 'ยังไม่มีเอกสาร วางไฟล์ในโฟลเดอร์ Drive ของหัวข้อ แล้วกด 🔍 หาไฟล์ใหม่') + '</div>';
  }

      '<div class="stats mt">' + stat(a.correct, 'ตอบถูก') + stat(a.total - a.correct, 'ผิด / ไม่ตอบ') + stat(fmtClock(a.time_used), 'เวลาที่ใช้') + stat(a.total, 'จำนวนข้อ') + '</div></section>';

        const t = topicById(k);
        const p = Math.round(byT[k].c * 100 / byT[k].n);
        const ok = p >= passPct();
        return '<div class="trow"><div class="row"><span class="grow">' + esc(t ? t.name : 'ไม่ระบุหัวข้อ') + '</span><b class="' + (ok ? 'pass' : 'fail') + '">' + byT[k].c + '/' + byT[k].n + ' (' + p + '%)</b></div>' +
          '<div class="bar mt"><i style="width:' + p + '%;background:var(' + (ok ? '--ok' : '--bad') + ')"></i></div></div>';
      }).join('') + '</section>';
    }
    h += '<div class="row wrap mb">' + (wrongQs.length ? '<button class="btn primary" data-act="retryWrong">🔁 ฝึกซ้ำเฉพาะข้อที่ผิด (' + wrongQs.length + ')</button>' : '') +

      segBtn('resFilter', 'wrong', 'ผิด (' + wrongQs.length + ')', f) + segBtn('resFilter', 'right', 'ถูก (' + (r.qs.length - wrongQs.length) + ')', f) + '</div>';
    let shown = 0;
    r.qs.forEach(function (q, i) {
      const x = am[q.id] || { chosen: '', correct: false };
      if ((f === 'wrong' && x.correct) || (f === 'right' && !x.correct)) return;
      shown++;
      h += '<div class="rv"><div class="small muted">ข้อ ' + (i + 1) + ' · ' + (x.correct ? '<span class="pass">✅ ถูก</span>' : (x.chosen ? '<span class="fail">❌ ผิด</span>' : '<span class="fail">⭕ ไม่ได้ตอบ</span>')) + '</div>' +
        '<div class="qtext">' + br(q.question) + '</div>';
      KEYS.forEach(function (k, j) {
        if (!q[k]) return;

      });
      if (q.explanation) h += '<div class="fb">💡 ' + br(q.explanation) + (q.reference ? '<div class="small muted mt">อ้างอิง: ' + esc(q.reference) + '</div>' : '') + '</div>';
      h += '<div class="row wrap mt"><button class="btn sm" data-act="speakExp" data-id="' + esc(q.id) + '">🔊 ฟังเฉลย</button><button class="btn sm danger" data-act="flagQ" data-id="' + esc(q.id) + '">⚠️ แจ้งข้อนี้ผิด</button></div></div>';
    });
    if (!shown) h += '<div class="empty">ไม่มีข้อในกลุ่มนี้</div>';
    return h + '</section>';
  }
  function chartSvg(items) {
    const W = 600, H = 220, L = 36, R = 14, T = 12, B = 28;
    const pw = W - L - R, ph = H - T - B, n = items.length;
    function x(i) { return n === 1 ? L + pw / 2 : L + i * pw / (n - 1); }
    function y(v) { return T + ph - (Math.max(0, Math.min(100, Number(v) || 0)) / 100) * ph; }
    let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">';
    [0, 25, 50, 75, 100].forEach(function (v) {
      s += '<line class="ch-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ch-txt" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    });
    s += '<line class="ch-pass" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(passPct()) + '" y2="' + y(passPct()) + '"/>';
    if (n > 1) s += '<polyline class="ch-line" points="' + items.map(function (h, i) { return x(i).toFixed(1) + ',' + y(h.score).toFixed(1); }).join(' ') + '"/>';
    items.forEach(function (h, i) { s += '<circle class="ch-dot" cx="' + x(i).toFixed(1) + '" cy="' + y(h.score).toFixed(1) + '" r="5"/>'; });
    return s + '</svg>';
  }
  function viewExamStats() {
    const topics = topicsOfAnn();
    const hist = allHistory();
    const st = qStats();
    const pass = passPct();
    const pool = questionsIn(topics.map(function (t) { return t.id; }));
    const done = pool.filter(function (q) { return (st[q.id] || {}).n > 0; }).length;
    const last10 = hist.slice(-10);
    let avg = 0, best = 0;
    last10.forEach(function (h) { avg += Number(h.score) || 0; });
    if (last10.length) avg = round1(avg / last10.length);
    hist.forEach(function (h) { best = Math.max(best, Number(h.score) || 0); });
    let h = '<section class="card"><h2>📊 ภาพรวม</h2><div class="stats">' + stat(hist.length, 'ชุดที่ทำแล้ว') + stat(avg + '%', 'เฉลี่ย 10 ครั้งหลัง') +
      stat(round1(best) + '%', 'คะแนนสูงสุด') + stat(done + '/' + pool.length, 'ข้อที่เคยทำ') + '</div></section>';
    if (hist.length) h += '<section class="card"><h2>📈 พัฒนาการคะแนน</h2>' + chartSvg(hist.slice(-20)) + '<div class="small muted">20 ครั้งล่าสุด · เส้นประ = เกณฑ์ผ่าน ' + pass + '%</div></section>';
    const rows = topics.map(function (t) {
      const qs = questionsIn([t.id]);
      let n = 0, w = 0, cov = 0, wr = 0;
      qs.forEach(function (q) {
        const s = st[q.id];
        if (!s) return;
        n += s.n; w += s.w;
        if (s.n) cov++;
        if (s.last === 'ผิด') wr++;
      });
      return { t: t, qs: qs.length, cov: cov, wr: wr, acc: n ? Math.round((n - w) * 100 / n) : -1 };
    }).sort(function (a, b) { return (a.acc < 0 ? 1000 : a.acc) - (b.acc < 0 ? 1000 : b.acc); });
    h += '<section class="card"><h2>🎯 ความแม่นแยกตามหัวข้อ</h2>' + (rows.length ? rows.map(function (r) {
      const ok = r.acc >= pass;
      return '<div class="trow"><div class="row"><b class="grow">' + esc(r.t.name) + '</b>' + (r.acc < 0 ? '<span class="small muted">ยังไม่เคยทำ</span>' : '<b class="' + (ok ? 'pass' : 'fail') + '">' + r.acc + '%</b>') + '</div>' +
        '<div class="bar mt"><i style="width:' + Math.max(r.acc, 0) + '%;background:var(' + (ok ? '--ok' : '--bad') + ')"></i></div>' +
        '<div class="row wrap small muted mt"><span class="grow">ทำแล้ว ' + r.cov + '/' + r.qs + ' ข้อ' + (r.wr ? ' · ค้างทวน ' + r.wr : '') + '</span>' +
        (r.qs ? '<button class="btn sm" data-act="practiceTopic" data-id="' + esc(r.t.id) + '">✏️ ฝึก</button>' : '') +
        (r.wr ? '<button class="btn sm" data-act="reviewTopic" data-id="' + esc(r.t.id) + '">🔁 ทวน</button>' : '') + '</div></div>';
    }).join('') : '<div class="empty">ยังไม่มีหัวข้อ</div>') + '</section>';
    h += '<section class="card"><h2>🕘 ประวัติการสอบ</h2>';
    if (!hist.length) h += '<div class="empty">ยังไม่มีประวัติการสอบ</div>';
    else {
      h += hist.slice(-30).reverse().map(function (x) {
        const lbl = topicLabel(x.topic_ids);
        return '<button class="hrow" data-act="openHist" data-id="' + esc(x.id) + '"><span class="score-pill ' + (Number(x.score) >= pass ? 'pass' : 'fail') + '">' + round1(x.score) + '%</span>' +
          '<span class="grow"><b>' + esc(x.mode || '') + '</b> <span class="small muted">' + fmtDate(x.date) + '</span><span class="qt">ถูก ' + x.correct + '/' + x.total +
          (Number(x.time_used) ? ' · ' + fmtDur(x.time_used) : '') + (lbl ? ' · ' + esc(lbl) : '') + (x.synced === false ? ' · ☁️ รอส่ง' : '') + '</span></span><span class="muted">›</span></button>';
      }).join('');
    }
    return h + '</section>';
  }

      const url = byId('fUrl').value.trim();

      function fail(t) { msg.textContent = '❌ ' + t; msg.className = 'msg bad'; }
      if (url.indexOf('https://script.google.com/') !== 0 || url.slice(-5) !== '/exec') { fail('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/ และลงท้ายด้วย /exec'); return; }
      if (pin.length < 4) { fail('กรุณาใส่ PIN'); return; }
      const fromSettings = state.view === 'settings' && isReady();
      const old = { apiUrl: cfg.apiUrl, pin: cfg.pin };
      cfg.apiUrl = url;
      cfg.pin = pin;
      el.disabled = true;
      el.textContent = 'กำลังเชื่อมต่อ...';
      api('bootstrap').then(function (d) {
        d.savedAt = new Date().toISOString();
        data = d;
        saveData();
        saveCfg();
        toast('เชื่อมต่อสำเร็จ ✅');
        goTo(fromSettings ? 'settings' : 'home');
      }).catch(function (err) {
        cfg.apiUrl = old.apiUrl;
        cfg.pin = old.pin;
        fail(err.message);
        el.disabled = false;
        el.textContent = 'ลองอีกครั้ง';
      });
    },
