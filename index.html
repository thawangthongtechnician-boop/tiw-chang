<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ติวช่าง">
<title>ติวหัวหน้าฝ่ายช่าง</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="appleIcon" href="icon.svg">
<style>
:root{--primary:#1e3a8a;--accent:#2563eb;--bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#eef2ff;--bad:#dc2626;--ok:#16a34a;--r:16px;--tab:64px;--side:96px}
[data-theme="dark"]{--bg:#0b1220;--card:#121a2b;--text:#e5e7eb;--muted:#94a3b8;--line:#243049;--soft:#1b2540;--accent:#60a5fa;--ok:#22c55e;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Thonburi","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--primary);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;min-width:0}
.brand .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:6px}
.topbar .icon-btn{color:#fff;background:rgba(255,255,255,.14)}
.pill{font-size:.75rem;padding:2px 10px;border-radius:999px;background:#f59e0b;color:#111;font-weight:700}
main{max-width:980px;margin:0 auto;padding:16px 14px calc(var(--tab) + 24px + env(safe-area-inset-bottom))}
body.has-mini main{padding-bottom:calc(var(--tab) + 100px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:1.2rem}
.narrow{max-width:520px;margin:24px auto}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mt{margin-top:12px}
.center{text-align:center}
.sec{margin:20px 4px 10px;font-size:1.05rem}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:var(--soft);cursor:pointer;font-size:1.15rem;flex:none}
.icon-btn.sm{width:38px;height:38px;font-size:1rem}
.icon-btn.lg{width:52px;height:52px;font-size:1.3rem}
.icon-btn:disabled{opacity:.45;cursor:default}
.spin span{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.field input,.field select,.big-select{width:100%;min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.big-select{font-weight:700;font-size:1.05rem;margin:4px 0 12px}
.msg{min-height:1.2em;margin:8px 0;font-size:.9rem}
.msg.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--accent)}
.stat span{font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r);padding:14px;cursor:pointer;width:100%}
.tname{font-weight:700;font-size:1.05rem}
.tdesc{color:var(--muted);font-size:.9rem}
.tmeta{display:flex;gap:14px;font-size:.85rem;color:var(--muted);margin-top:auto}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0 12px;cursor:pointer;font-size:1rem}
.doc-head{display:flex;gap:12px;align-items:center}
.dicon{font-size:1.6rem}
.dtitle{font-weight:600}
.badge{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--soft)}
.badge.ok{background:#dcfce7;color:#166534}
.badge.wait{background:#fef3c7;color:#92400e}
.badge.bad{background:#fee2e2;color:#991b1b}
details.sums{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
details.sums summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
.slist{list-style:none;margin:6px 0 0;padding:0}
.slist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.slist li:last-child{border-bottom:0}
.num,.qn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);margin-bottom:14px}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:0 0 14px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--accent)}
.player{margin-top:10px;padding:14px;border-radius:14px;background:var(--soft)}
.pnow{text-align:center;font-weight:600;min-height:1.6em}
.pctrl{display:flex;justify-content:center;align-items:center;gap:14px;margin:10px 0}
.play{width:68px;height:68px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:1.6rem;cursor:pointer}
.rates,.chips{display:flex;gap:6px;flex-wrap:wrap}
.rates{justify-content:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;min-height:38px;cursor:pointer;font-size:.92rem}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{display:flex;gap:10px;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;width:100%}
.qitem.on{background:var(--soft);border-color:var(--accent)}
.qitem.on .qn{background:var(--accent);color:#fff}
.qt{display:block;font-size:.8rem;color:var(--muted)}
.qx{display:block}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.mode b{font-size:1rem}
.mode span{font-size:.82rem;color:var(--muted)}
.mode.on{border-color:var(--accent);background:var(--soft)}
.inline-num{width:96px;min-height:38px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.switch{display:flex;gap:10px;align-items:center;cursor:pointer;margin:12px 0}
.switch input{width:22px;height:22px;flex:none}
.progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.25rem;padding:2px 12px;border-radius:10px;background:var(--soft)}
.timer.warn{background:#fee2e2;color:#991b1b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.qtext{font-size:1.12rem;font-weight:600;margin:6px 0 14px;line-height:1.75}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;min-height:56px}
.opt .ol{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.sel .ol{background:var(--accent);color:#fff}
.opt.correct{border-color:var(--ok);background:rgba(22,163,74,.12)}
.opt.correct .ol{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:rgba(220,38,38,.10)}
.opt.wrong .ol{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1;color:inherit}
.fb{border-radius:14px;padding:12px 14px;margin-top:4px;background:var(--soft);border-left:5px solid var(--accent)}
.fb.ok{border-left-color:var(--ok)}
.fb.bad{border-left-color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:10px}
.qg{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:.9rem;position:relative}
.qg.ans{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.qg.ok{background:rgba(22,163,74,.15);border-color:var(--ok);color:var(--ok)}
.qg.bad{background:rgba(220,38,38,.12);border-color:var(--bad);color:var(--bad)}
.qg.cur{outline:3px solid var(--accent);outline-offset:1px}
.qg.mk::after{content:'★';position:absolute;top:-8px;right:-4px;font-size:.8rem;color:#f59e0b}
.big-score{font-size:3.2rem;font-weight:800;line-height:1.15}
.pass{color:var(--ok)}
.fail{color:var(--bad)}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.trow{padding:12px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.hrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.hrow:last-child{border-bottom:0}
.score-pill{flex:none;min-width:66px;text-align:center;font-weight:800;border-radius:999px;padding:4px 10px}
.score-pill.pass{background:rgba(22,163,74,.15)}
.score-pill.fail{background:rgba(220,38,38,.12)}
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-pass{stroke:var(--ok);stroke-width:2;stroke-dasharray:6 6}
.ch-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--card);stroke:var(--accent);stroke-width:3}
.ch-txt{fill:var(--muted);font-size:12px}
.rv{border-top:1px solid var(--line);padding:14px 0}
.rv:first-child{border-top:0;padding-top:0}
.rv .opt{min-height:0;padding:8px 10px;margin-bottom:6px;cursor:default}
.rv .qtext{font-size:1rem}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub{max-width:90%;padding:10px 14px;border-radius:16px;line-height:1.7;word-wrap:break-word;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.bub.err{background:rgba(220,38,38,.10);color:var(--bad)}
.bub .li{padding-left:4px}
.bub .sp{height:6px}
.bub .src{font-size:.78rem;color:var(--muted);margin-top:6px}
.bub-tools{display:flex;gap:6px;margin-top:6px}
.typing span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:52px;max-height:200px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);resize:vertical}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
.send{background:var(--primary);color:#fff}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tab);border:0;background:none;cursor:pointer;color:var(--muted)}
.tab .ti{font-size:1.3rem;line-height:1}
.tab .tl{font-size:.72rem}
.tab.on{color:var(--accent);font-weight:700}
#mini{position:fixed;left:10px;right:10px;bottom:calc(var(--tab) + 8px + env(safe-area-inset-bottom));z-index:29;display:flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border-radius:16px;padding:6px 8px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:760px;margin:0 auto}
#mini .icon-btn{background:rgba(255,255,255,.15);color:#fff}
.mtext{flex:1;min-width:0;text-align:left;border:0;background:none;color:#fff;cursor:pointer;display:flex;flex-direction:column}
.mtext b,.mtext span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtext span{font-size:.8rem;opacity:.85}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 100px);transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw;text-align:center;font-size:.92rem}
#toast.show{opacity:1}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.mode-grid{grid-template-columns:1fr}}
@media (min-width:900px){
  body.has-tabs{padding-left:var(--side)}
  .tabbar{top:0;bottom:0;right:auto;width:var(--side);flex-direction:column;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 12px);border-top:0;border-right:1px solid var(--line)}
  .tab{flex:none;height:80px}
  main,body.has-mini main{padding-bottom:110px}
  #mini{left:calc(var(--side) + 16px);bottom:16px}
  #toast{bottom:100px}
}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main id="main"></main>
<div id="mini" hidden></div>
<nav class="tabbar" id="tabbar" hidden></nav>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  const APP_VERSION = '4.0.0';
  const NL = String.fromCharCode(10);
  const K_CFG = 'tiw_cfg';
  const K_DATA = 'tiw_data';
  const K_HIDE = 'tiw_hide_install';
  const K_LOCAL = 'tiw_attempts';
  const K_FLAGS = 'tiw_flags';
  const K_SES = 'tiw_session';
  const K_OLD = 'tiw_hist';
  const K_CHAT = 'tiw_chat';
  const LETTERS = ['ก', 'ข', 'ค', 'ง'];
  const KEYS = ['a', 'b', 'c', 'd'];
  const MODE_LABEL = { practice: 'ฝึกทำ', mock: 'จำลองสอบ', review: 'ทวนข้อผิด' };
  const SUGGEST = ['สรุปประเด็นสำคัญที่มักออกสอบ', 'มีตัวเลขหรือระยะเวลาอะไรที่ต้องจำบ้าง',
    'อธิบายให้เข้าใจง่ายเหมือนสอนมือใหม่', 'ยกตัวอย่างสถานการณ์ที่อาจออกเป็นข้อสอบ'];

  const DEFAULT_CFG = { apiUrl: '', pin: '', annId: '', theme: 'auto', font: 'normal',
    rate: 1, rateTouched: false, voice: '', qaPause: 5,
    exMode: 'practice', exTopics: [], exCount: 0, exMin: 0, exSmart: true,
    chatTopic: 'all', aiGeneral: false, autoSpeak: 'voice', autoSend: true,
    genTopic: '', genCount: 10, genDiff: 'กลาง' };
  let cfg = Object.assign({}, DEFAULT_CFG, loadJSON(K_CFG, {}));
  if (!Array.isArray(cfg.exTopics)) cfg.exTopics = [];
  if (!MODE_LABEL[cfg.exMode]) cfg.exMode = 'practice';
  let data = loadJSON(K_DATA, null);
  const state = { view: 'home', topicId: '', listenTopic: 'all', listenMode: 'summary',
    syncing: false, online: navigator.onLine, installEvt: null,
    examTab: 'start', ses: loadJSON(K_SES, null), res: null, gridOpen: false,
    aiTab: 'chat', chatBusy: false, chatDraft: '', listening: false, voiceAsked: false,
    genBusy: false, genMsg: '', genResult: null, procBusy: false, procMsg: '' };
  if (state.ses && (!Array.isArray(state.ses.qs) || !state.ses.qs.length)) state.ses = null;
  const player = { queue: [], key: '', idx: 0, chunkIdx: 0, playing: false, done: false, token: 0, timer: null, utter: null };
  let wakeLock = null;
  let toastTimer = null;
  let examTimer = null;
  let advTimer = null;
  let syncPromise = null;
  let recog = null;
  const hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  migrateOld();

  function byId(id) { return document.getElementById(id); }
  function loadJSON(k, d) {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; }
  }
  function saveJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { toast('พื้นที่เก็บข้อมูลในเครื่องเต็ม'); return false; }
  }
  function saveCfg() { saveJSON(K_CFG, cfg); }
  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;')
      .split('"').join('&quot;').split("'").join('&#39;');
  }
  function br(s) { return esc(s).split(NL).join('<br>'); }
  function shortText(s, n) {
    s = String(s || '').split(NL).join(' ');
    return s.length > n ? s.slice(0, n) + '…' : s;
  }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function round1(v) { return Math.round((Number(v) || 0) * 10) / 10; }
  function fmtDate(v) {
    if (!v) return '-';
    const d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ':' + pad2(m) : pad2(m)) + ':' + pad2(s);
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    const m = Math.floor(sec / 60), s = sec % 60;
    if (!m) return s + ' วินาที';
    return m + ' นาที' + (s ? ' ' + s + ' วินาที' : '');
  }
  function toast(msg) {
    const t = byId('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3500);
  }
  function isIOS() {
    const ua = navigator.userAgent;
    return ua.indexOf('iPhone') > -1 || ua.indexOf('iPad') > -1 ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function isStandalone() {
    return navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  function isReady() { return !!(cfg.apiUrl && cfg.pin && data); }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function newId() {
    return 'EX' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase();
  }

  function hasTTS() { return 'speechSynthesis' in window; }

  function chunkText(text) {
    const out = [];
    String(text || '').split(NL).forEach(function (line) {
      let cur = '';
      line.split(' ').forEach(function (w) {
        if (!w) return;
        while (w.length > 220) {
          if (cur) { out.push(cur); cur = ''; }
          out.push(w.slice(0, 220));
          w = w.slice(220);
        }
        if (!w) return;
        if (cur && (cur.length + w.length + 1) > 160) { out.push(cur); cur = w; }
        else cur = cur ? cur + ' ' + w : w;
      });
      if (cur) out.push(cur);
    });
    return out;
  }
  function qaChunks(q) {
    let c = chunkText('คำถาม. ' + q.question);
    KEYS.forEach(function (k, i) { if (q[k]) c = c.concat(chunkText('ข้อ ' + LETTERS[i] + '. ' + q[k])); });
    c.push((Number(cfg.qaPause) || 5) * 1000);
    const ai = LETTERS.indexOf(String(q.answer));
    c = c.concat(chunkText('เฉลย ข้อ ' + q.answer + (ai > -1 && q[KEYS[ai]] ? '. ' + q[KEYS[ai]] : '')));
    if (q.explanation) c = c.concat(chunkText('คำอธิบาย. ' + q.explanation));
    return c;

  function buildQueue(mode, tkey) {

  function startSpeak(tk) {
    if (!hasTTS()) { toast('เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน'); player.playing = false; updatePlayerUI(); return; }
    clearTimeout(player.timer);

  function speakChunk(tk) {
    if (tk !== player.token || !player.playing) return;
    const item = player.queue[player.idx];

    if (player.chunkIdx >= item.chunks.length) {
      if (player.idx + 1 < player.queue.length) {
        player.idx++;
        player.chunkIdx = 0;
        updatePlayerUI();
        player.timer = setTimeout(function () { speakChunk(tk); }, 700);
      } else {
        finishAll();
      }
      return;
    }
    const c = item.chunks[player.chunkIdx];
    if (typeof c === 'number') {
      player.timer = setTimeout(function () {
        if (tk !== player.token) return;
        player.chunkIdx++;
        speakChunk(tk);
      }, c);
      return;
    }
    const u = new SpeechSynthesisUtterance(c);
    u.lang = 'th-TH';
    u.rate = Number(cfg.rate) || 1;
    const v = pickVoice();
    if (v) u.voice = v;
    u.onend = function () {
      if (tk !== player.token) return;
      player.chunkIdx++;
      speakChunk(tk);

  function saveSession() { if (state.ses) saveJSON(K_SES, state.ses); }
  function timeLeft(s) { return Math.max(0, Math.round((s.endAt - Date.now()) / 1000)); }

  function smartPick(pool, st) {
    const arr = shuffle(pool);
    const pri = {};
    arr.forEach(function (q) {
      const s = st[q.id] || { n: 0, w: 0, last: '' };
      let p = 0;
      if (s.last === 'ผิด') p += 3;
      if (!s.n) p += 2;
      if (s.n) p += s.w / s.n;
      pri[q.id] = p;
    });
    return arr.sort(function (a, b) { return pri[b.id] - pri[a.id]; });
  }

  function startSession(o) {

    let qs = (o.mode === 'practice' && o.smart && !o.qs) ? smartPick(pool, st) : shuffle(pool);
    const n = Math.max(1, Math.min(Number(o.count) || qs.length, qs.length));

  function tick() {

    if (el) {

      el.classList.toggle('warn', left <= 300);
    }
    if (left <= 0) {
      clearInterval(examTimer);
      finishSession(true);
    }
  }

  function finishSession(auto) {
    const s = state.ses;
    if (!s) return;
    clearInterval(examTimer);
    clearTimeout(advTimer);
    const isMock = s.mode === 'mock';
    const items = s.qs.filter(function (q) { return isMock || s.answers[q.id]; });
    if (!items.length) {
      endSession();
      toast('ยังไม่ได้ตอบข้อใด จึงไม่บันทึกผล');
      goTo('exam');
      return;
    }
    const answers = items.map(function (q) {
      const chosen = s.answers[q.id] || '';
      return { qid: q.id, chosen: chosen, correct: chosen === String(q.answer) };
    });
    const correct = answers.filter(function (x) { return x.correct; }).length;
    const endTime = isMock ? Math.min(Date.now(), s.endAt) : Date.now();
    const tids = [];
    items.forEach(function (q) { if (tids.indexOf(q.topic_id) === -1) tids.push(q.topic_id); });
    const attempt = {
      id: s.id, date: new Date().toISOString(), mode: MODE_LABEL[s.mode], topic_ids: tids,
      total: items.length, correct: correct, score: round1(correct * 100 / items.length),
      time_used: Math.round((endTime - s.startAt) / 1000), time_limit: isMock ? s.limitMin : '',
      wrong_ids: answers.filter(function (x) { return !x.correct; }).map(function (x) { return x.qid; }).join(','),
      answers: answers, synced: false
    };
    const cur = localAttempts();
    cur.push(attempt);
    saveLocal(cur);
    endSession();
    state.res = { attempt: attempt, qs: items, filter: 'all' };
    state.view = 'result';
    render();
    window.scrollTo(0, 0);
    if (auto) toast('⏰ หมดเวลา ระบบส่งข้อสอบให้อัตโนมัติ');
    refresh(true);
  }

  function chatTopicIds() {

    if (cfg.chatTopic !== 'all' && topics.some(function (t) { return t.id === cfg.chatTopic; })) return [cfg.chatTopic];
    return topics.map(function (t) { return t.id; });

  function scrollEnd() { setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 40); }

  function mdLite(s) {
    return String(s || '').split(NL).map(function (line) {
      let t = line.trim();
      if (!t) return '<div class="sp"></div>';
      let bullet = false;
      if (t.charAt(0) === '#') {
        while (t.charAt(0) === '#') t = t.slice(1);
        t = '**' + t.trim() + '**';
      }
      if (t.indexOf('- ') === 0 || t.indexOf('* ') === 0 || t.indexOf('• ') === 0) { bullet = true; t = t.slice(2); }
      const html = esc(t).split('**').map(function (p, i) { return i % 2 ? '<b>' + p + '</b>' : p; }).join('');
      return bullet ? '<div class="li">• ' + html + '</div>' : '<div>' + html + '</div>';
    }).join('');
  }
  function plainText(s) {
    return String(s || '').split('**').join('').split(NL).map(function (l) {
      let t = l.trim();
      while (t.charAt(0) === '#') t = t.slice(1);
      t = t.trim();
      if (t.indexOf('- ') === 0 || t.indexOf('* ') === 0 || t.indexOf('• ') === 0) t = t.slice(2);
      return t;
    }).filter(function (t) { return t; }).join(NL);
  }

  function sendChat(text) {
    const box = byId('chatIn');
    const q = String(text || (box ? box.value : '') || '').trim();
    if (!q || state.chatBusy) return;
    if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ตเพื่อถาม AI'); return; }
    const voice = state.voiceAsked;
    state.voiceAsked = false;
    const msgs = chatLog();
    const hist = msgs.filter(function (m) { return !m.err; }).slice(-6)
      .map(function (m) { return { role: m.role, text: String(m.text).slice(0, 1500) }; });
    msgs.push({ role: 'user', text: q, t: Date.now() });
    saveChat(msgs);
    state.chatDraft = '';
    state.chatBusy = true;
    render();
    scrollEnd();
    api('chat', { question: q, topic_ids: chatTopicIds(), history: hist, allowGeneral: !!cfg.aiGeneral }, 150000)
      .then(function (d) {
        const arr = chatLog();
        arr.push({ role: 'model', text: d.answer, sources: d.sources || [], t: Date.now() });
        saveChat(arr);
        if (cfg.autoSpeak === 'always' || (cfg.autoSpeak === 'voice' && voice)) {
          speakText('chat' + Date.now(), 'คำตอบ AI', plainText(d.answer));
        }
      }).catch(function (err) {
        const arr = chatLog();
        arr.push({ role: 'model', text: '⚠️ ' + err.message, err: true, t: Date.now() });
        saveChat(arr);
      }).then(function () {
        state.chatBusy = false;
        if (state.view === 'chat') { render(); scrollEnd(); }
      });
  }

  function updateMicBtn() {
    const b = byId('micBtn');
    if (b) b.classList.toggle('on', state.listening);

  function toggleMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      toast('เครื่องนี้ใช้ไมค์ในแอปไม่ได้ ให้แตะช่องพิมพ์ แล้วกด 🎤 บนแป้นพิมพ์แทน');
      const b0 = byId('chatIn');
      if (b0) b0.focus();
      return;
    }
    if (state.listening && recog) { recog.stop(); return; }
    if (state.chatBusy) return;
    pauseSpeech();
    const box = byId('chatIn');
    const base = box && box.value.trim() ? box.value.trim() + ' ' : '';
    let finalText = '';
    recog = new SR();
    recog.lang = 'th-TH';
    recog.interimResults = true;
    recog.continuous = false;
    recog.onresult = function (ev) {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      const b = byId('chatIn');
      if (b) b.value = base + finalText + interim;
      state.chatDraft = base + finalText + interim;
    };
    recog.onerror = function (ev) {
      state.listening = false;
      updateMicBtn();
      const e = ev && ev.error;
      if (e === 'not-allowed' || e === 'service-not-allowed') toast('ไม่ได้รับอนุญาตใช้ไมค์ ให้กด 🎤 บนแป้นพิมพ์แทน');
      else if (e === 'no-speech') toast('ไม่ได้ยินเสียง ลองพูดใหม่อีกครั้ง');
      else if (e && e !== 'aborted') toast('ไมค์มีปัญหา (' + e + ') ให้กด 🎤 บนแป้นพิมพ์แทน');
    };
    recog.onend = function () {
      state.listening = false;
      updateMicBtn();
      const b = byId('chatIn');
      const t = b ? b.value.trim() : '';
      if (finalText.trim() && t && cfg.autoSend) {
        state.voiceAsked = true;
        sendChat(t);
      }
    };
    try {
      recog.start();
      state.listening = true;
      updateMicBtn();
      toast('🎤 พูดได้เลย');
    } catch (e) {
      state.listening = false;
      toast('เปิดไมค์ไม่ได้ ให้กด 🎤 บนแป้นพิมพ์แทน');
    }
  }

  function genQuiz() {
    const tid = genTopicId();
    if (!tid || state.genBusy) return;
    if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ต'); return; }
    const total = Number(cfg.genCount) || 10;
    const diff = cfg.genDiff || 'กลาง';
    const got = [];
    let rounds = 0;
    const maxRounds = Math.ceil(total / 10) + 1;
    state.genBusy = true;
    state.genResult = null;
    keepAwake(true);
    function step() {
      const left = total - got.length;
      if (left <= 0 || rounds >= maxRounds) return Promise.resolve();
      rounds++;
      state.genMsg = '⏳ AI กำลังออกข้อสอบ... ได้แล้ว ' + got.length + '/' + total + ' ข้อ';
      if (state.view === 'chat') render();
      return api('genQuestions', { topic_id: tid, count: Math.min(10, left), difficulty: diff }, 300000).then(function (d) {
        const qs = (d && d.questions) || [];
        if (!qs.length) throw new Error('AI ไม่ได้ส่งข้อสอบที่ใช้ได้กลับมา ลองใหม่อีกครั้ง');
        qs.forEach(function (q) { got.push(q); });
        if (data) { data.questions = list('questions').concat(qs); saveJSON(K_DATA, data); }
        return step();
      });
    }
    step().then(function () {
      state.genMsg = '✅ ออกข้อสอบเสร็จ ' + got.length + ' ข้อ บันทึกลงคลังแล้ว';
    }).catch(function (err) {
      state.genMsg = '⚠️ ' + err.message + (got.length ? ' (ได้มาแล้ว ' + got.length + ' ข้อ บันทึกไว้แล้ว)' : '');
    }).then(function () {
      state.genBusy = false;
      state.genResult = got.length ? got : null;
      keepAwake(false);
      if (state.view === 'chat') render(); else toast(state.genMsg);
    });
  }

  function processDocs(ids) {
    if (!ids.length || state.procBusy) return;
    if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ต'); return; }
    state.procBusy = true;
    keepAwake(true);
    let i = 0, ok = 0, fail = 0, lastErr = '';
    function done(stopMsg) {
      state.procBusy = false;
      keepAwake(false);
      state.procMsg = (stopMsg ? '⚠️ หยุดก่อน: ' + stopMsg + NL : '') + '✅ สำเร็จ ' + ok + ' ฉบับ' +
        (fail ? ' · ผิดพลาด ' + fail + ' ฉบับ' + (lastErr && !stopMsg ? NL + 'ล่าสุด: ' + lastErr : '') : '');
      if (state.view === 'chat') render();
      refresh(true);
    }
    function next() {
      if (i >= ids.length) { done(''); return; }
      const d = docById(ids[i]);
      state.procMsg = '⏳ กำลังประมวลผล ' + (i + 1) + '/' + ids.length + ': ' + (d ? d.title : ids[i]) + NL +
        'ฉบับละประมาณ 1-3 นาที ระหว่างนี้อย่าปิดแอป';
      if (state.view === 'chat') render();
      api('processDoc', { id: ids[i] }, 340000).then(function (r) {
        ok++;
        if (d) { d.status = 'ประมวลผลแล้ว'; d.char_count = r.chars; d.note = r.note; }
        i++;
        next();
      }).catch(function (err) {
        fail++;
        lastErr = err.message;
        const stop = AI_STOP.indexOf(err.code) > -1;
        if (d) { if (!stop) d.status = 'ผิดพลาด'; d.note = err.message; }
        if (stop) { done(err.message); return; }
        i++;
        next();
      });
    }
    next();
  }

    const nOk = s.qs.filter(function (x) { return s.answers[x.id] && s.answers[x.id] === String(x.answer); }).length;

    let h = '<section class="card"><div class="row between wrap"><div><b>' + MODE_LABEL[s.mode] + '</b>' +
      ' <span class="muted">· ข้อ ' + (s.cur + 1) + '/' + s.qs.length + '</span></div>';
    if (s.mode === 'mock') h += '<div id="exTimer" class="timer' + (timeLeft(s) <= 300 ? ' warn' : '') + '">' + fmtClock(timeLeft(s)) + '</div>';
    else h += '<div class="small">✅ ถูก <b>' + nOk + '</b> / ตอบ ' + nAns + '</div>';
    h += '</div><div class="progress"><i style="width:' + Math.round(nAns * 100 / s.qs.length) + '%"></i></div></section>';

    h += '<section class="card"><div class="row"><div class="grow small muted">' + esc(t ? t.name : '') + '</div>' +
      '<button class="icon-btn sm" data-act="speakQ" aria-label="อ่านโจทย์">🔊</button>' +
      (s.mode === 'mock' ? '<button class="icon-btn sm" data-act="markQ" aria-label="ทำเครื่องหมาย">' + (s.marks[q.id] ? '★' : '☆') + '</button>' : '') +
      '</div><div class="qtext">' + (s.cur + 1) + '. ' + br(q.question) + '</div>';
    KEYS.forEach(function (k, i) {
      if (!q[k]) return;

      h += '<button class="' + c + '" data-act="pick" data-id="' + L + '"' + (reveal ? ' disabled' : '') + '>' +
        '<span class="ol">' + L + '</span><span class="grow">' + br(q[k]) + '</span></button>';
    });
    if (reveal) h += feedbackBox(q, chosen);
    h += '<div class="row between wrap mt"><button class="btn" data-act="sesNav" data-id="-1"' + (s.cur === 0 ? ' disabled' : '') + '>‹ ก่อนหน้า</button>';
    if (s.cur + 1 < s.qs.length) h += '<button class="btn primary" data-act="sesNav" data-id="1">ถัดไป ›</button>';
    else h += '<button class="btn primary" data-act="finish">' + (s.mode === 'mock' ? '🏁 ส่งข้อสอบ' : '🏁 ดูผล') + '</button>';
    h += '</div></section>';

    h += '<section class="card"><button class="btn ghost sm block" style="justify-content:flex-start" data-act="toggleGrid">' +
      (state.gridOpen ? '▾' : '▸') + ' ภาพรวมทุกข้อ (ตอบแล้ว ' + nAns + '/' + s.qs.length + ')</button>';
    if (state.gridOpen) {
      h += '<div class="qgrid">' + s.qs.map(function (x, i) {
        let c = 'qg';
        const a = s.answers[x.id];
        if (a) c += instant ? (a === String(x.answer) ? ' ok' : ' bad') : ' ans';
        if (s.marks[x.id]) c += ' mk';

        return '<button class="' + c + '" data-act="jump" data-id="' + i + '">' + (i + 1) + '</button>';
      }).join('') + '</div>';

      (s.mode === 'mock' ? '<button class="btn primary" data-act="finish">🏁 ส่งข้อสอบ</button>' : '<button class="btn" data-act="finish">🏁 จบและดูผล</button>') +
      '<button class="btn danger" data-act="discard">🗑 ทิ้งชุดนี้</button></div>';

    else h += '<p class="small muted">พักไว้ได้ สลับไปหน้าอื่นแล้วกลับมาที่แท็บ 📝 จะทำต่อจากข้อเดิม</p>';

  function viewResult() {
    const r = state.res;
    if (!r) { state.view = 'exam'; return viewExam(); }
    const a = r.attempt;
    const pass = Number(a.score) >= passPct();
    const am = {};
    (a.answers || []).forEach(function (x) { am[x.qid] = x; });
    const wrongQs = r.qs.filter(function (q) { return am[q.id] && !am[q.id].correct; });

    let h = '<button class="back" data-act="go" data-id="exam">‹ กลับหน้าข้อสอบ</button>';
    h += '<section class="card center"><div class="muted">' + esc(a.mode) + ' · ' + fmtDate(a.date) + '</div>' +
      '<div class="big-score ' + (pass ? 'pass' : 'fail') + '">' + round1(a.score) + '%</div>' +
      '<div><b>' + (pass ? '🎉 ผ่านเกณฑ์' : '💪 ยังไม่ผ่านเกณฑ์') + '</b> <span class="muted">(เกณฑ์ ' + passPct() + '%)</span></div>' +
      '<div class="stats mt">' + stat(a.correct, 'ตอบถูก') + stat(a.total - a.correct, 'ผิด / ไม่ตอบ') +
      stat(fmtClock(a.time_used), 'เวลาที่ใช้') + stat(a.total, 'จำนวนข้อ') + '</div>' +
      (a.time_limit ? '<div class="small muted mt">เวลาที่กำหนด ' + a.time_limit + ' นาที</div>' : '') + '</section>';

    const byT = {};
    r.qs.forEach(function (q) {
      const x = am[q.id];
      if (!x) return;
      const k = q.topic_id || '-';
      if (!byT[k]) byT[k] = { n: 0, c: 0 };
      byT[k].n++;
      if (x.correct) byT[k].c++;
    });
    const tk = Object.keys(byT);
    if (tk.length > 1) {
      h += '<section class="card"><h2>คะแนนแยกตามหัวข้อ</h2>' + tk.map(function (k) {
        const t = topicById(k);
        const p = Math.round(byT[k].c * 100 / byT[k].n);
        const ok = p >= passPct();
        return '<div class="trow"><div class="row"><span class="grow">' + esc(t ? t.name : 'ไม่ระบุหัวข้อ') + '</span>' +
          '<b class="' + (ok ? 'pass' : 'fail') + '">' + byT[k].c + '/' + byT[k].n + ' (' + p + '%)</b></div>' +
          '<div class="bar mt"><i style="width:' + p + '%;background:var(' + (ok ? '--ok' : '--bad') + ')"></i></div></div>';
      }).join('') + '</section>';
    }

    h += '<div class="row wrap" style="margin-bottom:14px">' +
      (wrongQs.length ? '<button class="btn primary" data-act="retryWrong">🔁 ฝึกซ้ำเฉพาะข้อที่ผิด (' + wrongQs.length + ')</button>' : '') +
      '<button class="btn" data-act="go" data-id="exam">🔄 ทำชุดใหม่</button></div>';

    const f = r.filter || 'all';
    h += '<section class="card"><h2>ทวนคำตอบ</h2><div class="seg">' +
      segBtn('resFilter', 'all', 'ทั้งหมด (' + r.qs.length + ')', f) +
      segBtn('resFilter', 'wrong', 'ผิด (' + wrongQs.length + ')', f) +
      segBtn('resFilter', 'right', 'ถูก (' + (r.qs.length - wrongQs.length) + ')', f) + '</div>';
    let shown = 0;
    r.qs.forEach(function (q, i) {
      const x = am[q.id] || { chosen: '', correct: false };
      if (f === 'wrong' && x.correct) return;
      if (f === 'right' && !x.correct) return;
      shown++;
      const t = topicById(q.topic_id);
      h += '<div class="rv"><div class="small muted">ข้อ ' + (i + 1) + (t ? ' · ' + esc(t.name) : '') + ' · ' +
        (x.correct ? '<span class="pass">✅ ถูก</span>' : (x.chosen ? '<span class="fail">❌ ผิด</span>' : '<span class="fail">⭕ ไม่ได้ตอบ</span>')) + '</div>' +
        '<div class="qtext">' + br(q.question) + '</div>';
      KEYS.forEach(function (k, j) {
        if (!q[k]) return;
        const L = LETTERS[j];
        let c = 'opt';
        if (L === String(q.answer)) c += ' correct';
        else if (L === x.chosen) c += ' wrong';
        h += '<div class="' + c + '"><span class="ol">' + L + '</span><span class="grow">' + br(q[k]) + '</span></div>';
      });
      if (q.explanation) h += '<div class="fb"><div>💡 ' + br(q.explanation) + '</div>' +
        (q.reference ? '<div class="small muted mt">อ้างอิง: ' + esc(q.reference) + '</div>' : '') + '</div>';
      h += '<div class="row wrap mt"><button class="btn sm" data-act="speakExp" data-id="' + esc(q.id) + '">🔊 ฟังเฉลย</button>' +
        '<button class="btn sm danger" data-act="flagQ" data-id="' + esc(q.id) + '">⚠️ แจ้งข้อนี้ผิด</button></div></div>';
    });
    if (!shown) h += '<div class="empty">ไม่มีข้อในกลุ่มนี้</div>';
    h += '</section>';
    return h;
  }

  function chartSvg(items) {
    const W = 600, H = 220, L = 36, R = 14, T = 12, B = 28;
    const pw = W - L - R, ph = H - T - B, n = items.length;
    function x(i) { return n === 1 ? L + pw / 2 : L + i * pw / (n - 1); }
    function y(v) { return T + ph - (Math.max(0, Math.min(100, Number(v) || 0)) / 100) * ph; }
    let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="กราฟคะแนน">';
    [0, 25, 50, 75, 100].forEach(function (v) {
      s += '<line class="ch-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
        '<text class="ch-txt" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    });
    s += '<line class="ch-pass" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(passPct()) + '" y2="' + y(passPct()) + '"/>';
    if (n > 1) {
      s += '<polyline class="ch-line" points="' + items.map(function (h, i) {
        return x(i).toFixed(1) + ',' + y(h.score).toFixed(1);
      }).join(' ') + '"/>';
    }
    items.forEach(function (h, i) {
      s += '<circle class="ch-dot" cx="' + x(i).toFixed(1) + '" cy="' + y(h.score).toFixed(1) + '" r="5"/>';
    });
    s += '<text class="ch-txt" x="' + L + '" y="' + (H - 6) + '">เก่า</text>' +
      '<text class="ch-txt" x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">ล่าสุด</text></svg>';
    return s;
  }

  function viewExamStats() {
    const topics = topicsOfAnn();
    const hist = allHistory();
    const st = qStats();
    const pass = passPct();
    const pool = questionsIn(topics.map(function (t) { return t.id; }));
    const done = pool.filter(function (q) { return (st[q.id] || {}).n > 0; }).length;
    const last10 = hist.slice(-10);
    let avg = 0, best = 0;
    last10.forEach(function (h) { avg += Number(h.score) || 0; });
    if (last10.length) avg = round1(avg / last10.length);
    hist.forEach(function (h) { best = Math.max(best, Number(h.score) || 0); });

    let h = '<section class="card"><h2>📊 ภาพรวม</h2><div class="stats">' +
      stat(hist.length, 'ชุดที่ทำแล้ว') + stat(avg + '%', 'เฉลี่ย 10 ครั้งหลัง') +
      stat(round1(best) + '%', 'คะแนนสูงสุด') + stat(done + '/' + pool.length, 'ข้อที่เคยทำ') + '</div></section>';

    if (hist.length) {
      h += '<section class="card"><h2>📈 พัฒนาการคะแนน</h2>' + chartSvg(hist.slice(-20)) +
        '<div class="small muted">20 ครั้งล่าสุด · เส้นประสีเขียว = เกณฑ์ผ่าน ' + pass + '%</div></section>';
    }

    const rows = topics.map(function (t) {
      const qs = questionsIn([t.id]);
      let n = 0, w = 0, cov = 0, wr = 0;
      qs.forEach(function (q) {
        const s = st[q.id];
        if (!s) return;
        n += s.n; w += s.w;
        if (s.n) cov++;
        if (s.last === 'ผิด') wr++;
      });
      return { t: t, qs: qs.length, cov: cov, wr: wr, acc: n ? Math.round((n - w) * 100 / n) : -1 };
    }).sort(function (a, b) { return (a.acc < 0 ? 1000 : a.acc) - (b.acc < 0 ? 1000 : b.acc); });

    h += '<section class="card"><h2>🎯 ความแม่นแยกตามหัวข้อ</h2>';
    if (rows.length && rows[0].acc >= 0 && rows[0].acc < pass) {
      h += '<div class="banner"><div>💡 หัวข้อที่ควรเน้น: <b>' + esc(rows[0].t.name) + '</b></div></div>';
    }
    h += rows.length ? rows.map(function (r) {
      const ok = r.acc >= pass;
      return '<div class="trow"><div class="row"><b class="grow">' + esc(r.t.name) + '</b>' +
        (r.acc < 0 ? '<span class="small muted">ยังไม่เคยทำ</span>' : '<b class="' + (ok ? 'pass' : 'fail') + '">' + r.acc + '%</b>') + '</div>' +
        '<div class="bar mt"><i style="width:' + Math.max(r.acc, 0) + '%;background:var(' + (ok ? '--ok' : '--bad') + ')"></i></div>' +
        '<div class="row wrap small muted mt"><span class="grow">ทำแล้ว ' + r.cov + '/' + r.qs + ' ข้อ' + (r.wr ? ' · ค้างทวน ' + r.wr + ' ข้อ' : '') + '</span>' +
        (r.qs ? '<button class="btn sm" data-act="practiceTopic" data-id="' + esc(r.t.id) + '">✏️ ฝึก</button>' : '') +
        (r.wr ? '<button class="btn sm" data-act="reviewTopic" data-id="' + esc(r.t.id) + '">🔁 ทวน</button>' : '') + '</div></div>';
    }).join('') : '<div class="empty">ยังไม่มีหัวข้อ</div>';
    h += '</section>';

    const often = pool.filter(function (q) { return (st[q.id] || {}).w > 0; })
      .sort(function (a, b) { return st[b.id].w - st[a.id].w; }).slice(0, 10);
    if (often.length) {
      h += '<section class="card"><h2>⚠️ ข้อที่ผิดบ่อย</h2>' + often.map(function (q) {
        const s = st[q.id];
        return '<div class="trow"><div>' + esc(shortText(q.question, 120)) + '</div>' +
          '<div class="small muted">ผิด ' + s.w + ' จาก ' + s.n + ' ครั้ง · ล่าสุด' + (s.last === 'ผิด' ? '<span class="fail"> ผิด</span>' : '<span class="pass"> ถูก</span>') +
          ' · เฉลยข้อ ' + esc(q.answer) + '</div></div>';
      }).join('') + '</section>';
    }

    h += '<section class="card"><h2>🕘 ประวัติการสอบ</h2>';
    if (!hist.length) h += '<div class="empty">ยังไม่มีประวัติการสอบ</div>';
    else {
      h += hist.slice(-30).reverse().map(function (x) {
        const ok = Number(x.score) >= pass;
        const lbl = topicLabel(x.topic_ids);
        return '<button class="hrow" data-act="openHist" data-id="' + esc(x.id) + '">' +
          '<span class="score-pill ' + (ok ? 'pass' : 'fail') + '">' + round1(x.score) + '%</span>' +
          '<span class="grow"><b>' + esc(x.mode || '') + '</b> <span class="small muted">' + fmtDate(x.date) + '</span>' +
          '<span class="qt">ถูก ' + x.correct + '/' + x.total + ' ข้อ' + (Number(x.time_used) ? ' · ' + fmtDur(x.time_used) : '') +
          (lbl ? ' · ' + esc(lbl) : '') + (x.synced === false ? ' · ☁️ รอส่ง' : '') + '</span></span>' +
          '<span class="muted">›</span></button>';
      }).join('');
      h += '<div class="small muted mt">แตะเพื่อดูเฉลยย้อนหลัง (ได้เฉพาะชุดที่ทำบนเครื่องนี้ 30 ชุดล่าสุด)</div>';
    }
    h += '</section>';
    return h;
  }

  const VIEWS = { home: viewHome, learn: viewLearn, topic: viewTopic, listen: viewListen,
    exam: viewExam, result: viewResult, chat: viewChat, settings: viewSettings };

  function goTo(view) { state.view = view; render(); window.scrollTo(0, 0); }

  const ACTIONS = {
    go: function (id) { goTo(id); },
    openTopic: function (id) { state.topicId = id; goTo('topic'); },
    sync: function () { refresh(false); },
    connect: function (id, el) {
      const url = byId('fUrl').value.trim();
      const pin = byId('fPin').value.trim();
      const msg = byId('fMsg');
      function fail(t) { msg.textContent = '❌ ' + t; msg.className = 'msg bad'; }
      if (url.indexOf('https://script.google.com/') !== 0 || url.slice(-5) !== '/exec') {
        fail('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/ และลงท้ายด้วย /exec'); return;
      }
      if (pin.length < 4) { fail('กรุณาใส่ PIN'); return; }
      if (!navigator.onLine) { fail('ต้องต่ออินเทอร์เน็ตก่อน'); return; }
      const fromSettings = state.view === 'settings' && isReady();
      const old = { apiUrl: cfg.apiUrl, pin: cfg.pin };
      cfg.apiUrl = url;
      cfg.pin = pin;
      el.disabled = true;
      el.textContent = 'กำลังเชื่อมต่อ...';
      api('bootstrap').then(function (d) {
        d.savedAt = new Date().toISOString();
        data = d;
        saveJSON(K_DATA, d);
        saveCfg();
        applyServerSettings();
        toast('เชื่อมต่อสำเร็จ ✅');
        state.view = fromSettings ? 'settings' : 'home';
        render();
      }).catch(function (err) {
        cfg.apiUrl = old.apiUrl;
        cfg.pin = old.pin;
        fail(err.message);
        el.disabled = false;
        el.textContent = fromSettings ? 'ทดสอบและบันทึก' : 'เชื่อมต่อ';
      });
    },

    quickListen: function (id) { state.listenMode = id; state.listenTopic = 'all'; goTo('listen'); playSelection(0); },
    listenTopic: function (id) { state.listenMode = 'summary'; state.listenTopic = id; goTo('listen'); playSelection(0); },
    listenQA: function (id) { state.listenMode = 'qa'; state.listenTopic = id; goTo('listen'); playSelection(0); },
    mode: function (id) { state.listenMode = id; render(); },
    playAt: function (id) {
      const i = Number(id);
      if (player.key === selKey() && player.queue.length) playItem(i); else playSelection(i);
    },
    pToggleSel: function () {
      if (player.key === selKey() && player.queue.length) togglePlay(); else playSelection(0);
    },
    pToggle: function () { togglePlay(); },
    pNext: function () { nextItem(); },
    pPrev: function () { prevItem(); },
    pStop: function () { stopAll(); },
    rate: function (id) {
      cfg.rate = Number(id) || 1;
      cfg.rateTouched = true;
      saveCfg();
      const chips = document.querySelectorAll('[data-act="rate"]');
      for (let i = 0; i < chips.length; i++) chips[i].classList.toggle('on', Number(chips[i].getAttribute('data-id')) === cfg.rate);
      if (player.playing) { player.token++; startSpeak(player.token); }
    },
    speakOne: function (id) {
      const s = list('summaries').find(function (x) { return x.id === id; });
      if (!s) return;
      const d = docById(s.doc_id);
      const t = topicById(sumTopic(s));
      speakText(s.id, d ? d.title : (t ? t.name : ''), s.text);
    },
    openDoc: function (id) {
      const d = docById(id);
      if (!d || !d.open_url) return;
      if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ตเพื่อเปิดไฟล์ต้นฉบับ'); return; }
      window.open(d.open_url, '_blank', 'noopener');
    },

    examTab: function (id) { state.examTab = id; render(); },
    exMode: function (id) { cfg.exMode = id; saveCfg(); render(); },
    exTopic: function (id) {
      if (id === 'all') cfg.exTopics = [];
      else {
        const i = cfg.exTopics.indexOf(id);
        if (i > -1) cfg.exTopics.splice(i, 1); else cfg.exTopics.push(id);
      }
      saveCfg();
      render();
    },
    exCountSet: function (id) { cfg.exCount = Number(id); saveCfg(); render(); },
    exMinSet: function (id) { cfg.exMin = Number(id); saveCfg(); render(); },
    quickExam: function (id) {
      if (state.ses) { toast('มีข้อสอบทำค้างอยู่'); goTo('exam'); return; }
      cfg.exMode = id;
      cfg.exTopics = [];
      saveCfg();
      state.examTab = 'start';
      goTo('exam');
    },
    startExam: function () {
      const s = selectedTopics();
      startSession({ mode: cfg.exMode, tids: s.tids, count: examCount(), minutes: examMinutes(), smart: cfg.exSmart });
    },
    practiceTopic: function (id) {
      if (!guardSession()) return;
      startSession({ mode: 'practice', tids: [id], count: examCount(), smart: true });
    },
    reviewTopic: function (id) {
      if (!guardSession()) return;
      startSession({ mode: 'review', tids: [id], count: 999 });
    },

    pick: function (L) {
      const s = state.ses;
      if (!s) return;
      const q = s.qs[s.cur];
      if (s.mode !== 'mock' && s.answers[q.id]) return;
      s.answers[q.id] = L;
      saveSession();
      render();
      if (s.mode === 'mock' && s.cur + 1 < s.qs.length) {
        clearTimeout(advTimer);
        const at = s.cur;
        advTimer = setTimeout(function () {
          if (state.ses === s && s.cur === at && state.view === 'exam') {
            s.cur++;
            saveSession();
            render();
            window.scrollTo(0, 0);
          }
        }, 350);
      }
    },
    sesNav: function (d) {
      const s = state.ses;
      if (!s) return;
      clearTimeout(advTimer);
      s.cur = Math.max(0, Math.min(s.qs.length - 1, s.cur + Number(d)));
      saveSession();
      render();
      window.scrollTo(0, 0);
    },
    jump: function (i) {
      const s = state.ses;
      if (!s) return;
      clearTimeout(advTimer);
      s.cur = Number(i);
      saveSession();
      render();
      window.scrollTo(0, 0);
    },
    toggleGrid: function () { state.gridOpen = !state.gridOpen; render(); },
    markQ: function () {
      const s = state.ses;
      if (!s) return;
      const q = s.qs[s.cur];
      if (s.marks[q.id]) delete s.marks[q.id]; else s.marks[q.id] = true;
      saveSession();
      render();
    },
    speakQ: function () {
      const s = state.ses;
      if (!s) return;
      const q = s.qs[s.cur];
      let t = 'ข้อ ' + (s.cur + 1) + '. ' + q.question;
      KEYS.forEach(function (k, i) { if (q[k]) t += NL + 'ข้อ ' + LETTERS[i] + '. ' + q[k]; });
      speakText('q' + q.id, 'โจทย์ข้อ ' + (s.cur + 1), t);
    },
    speakExp: function (id) {
      const q = findQ(id);
      if (!q) return;
      const ai = LETTERS.indexOf(String(q.answer));
      let t = 'เฉลย ข้อ ' + q.answer + (ai > -1 && q[KEYS[ai]] ? '. ' + q[KEYS[ai]] : '');
      if (q.explanation) t += NL + 'คำอธิบาย. ' + q.explanation;
      speakText('e' + q.id, 'เฉลย', t);
    },
    finish: function () {
      const s = state.ses;
      if (!s) return;
      if (s.mode === 'mock') {
        const un = s.qs.length - answeredCount(s);
        const mk = Object.keys(s.marks).length;
        let msg = 'ส่งข้อสอบเลยไหม?';
        if (un) msg += NL + '• ยังไม่ได้ตอบ ' + un + ' ข้อ (จะนับเป็นผิด)';
        if (mk) msg += NL + '• มีข้อที่ทำเครื่องหมาย ★ ไว้ ' + mk + ' ข้อ';
        if (!window.confirm(msg)) return;
      }
      finishSession(false);
    },
    discard: function () {
      if (!window.confirm('ทิ้งข้อสอบชุดนี้? ผลจะไม่ถูกบันทึก')) return;
      endSession();
      goTo('exam');
    },
    flagQ: function (id) {
      const reason = window.prompt('ข้อนี้ผิดอย่างไร? (เช่น เฉลยผิด โจทย์กำกวม ตัวเลือกซ้ำ)', 'เฉลยผิด');
      if (reason === null) return;
      const fl = loadJSON(K_FLAGS, []);
      fl.push({ id: id, reason: reason });
      saveJSON(K_FLAGS, fl);
      if (data) {
        data.questions = list('questions').filter(function (q) { return q.id !== id; });
        saveJSON(K_DATA, data);
      }
      toast(navigator.onLine ? 'แจ้งแล้ว ข้อนี้จะไม่ถูกสุ่มมาอีก' : 'บันทึกไว้แล้ว จะส่งเมื่อออนไลน์');
      syncAll().catch(function () { /* ส่งรอบหน้า */ });
    },

    resFilter: function (id) { if (state.res) { state.res.filter = id; render(); } },
    retryWrong: function () {
      const r = state.res;
      if (!r) return;
      const am = {};
      (r.attempt.answers || []).forEach(function (x) { am[x.qid] = x; });
      const qs = r.qs.filter(function (q) { return am[q.id] && !am[q.id].correct; });
      if (!guardSession()) return;
      startSession({ mode: 'review', qs: qs });
    },
    openHist: function (id) {
      const a = localAttempts().find(function (x) { return x.id === id; });
      if (!a || !Array.isArray(a.answers)) { toast('ดูเฉลยย้อนหลังได้เฉพาะชุดที่ทำบนเครื่องนี้'); return; }
      const qs = a.answers.map(function (x) { return list('questions').find(function (q) { return q.id === x.qid; }); })
        .filter(function (q) { return q; }).map(snapQ);
      if (!qs.length) { toast('ไม่พบข้อสอบของชุดนี้ในคลังแล้ว'); return; }
      state.res = { attempt: a, qs: qs, filter: 'all' };
      goTo('result');
    },
    clearHistory: function () {
      if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ตก่อน'); return; }
      if (!window.confirm('ล้างประวัติการสอบและสถิติทั้งหมด? (ข้อสอบในคลังไม่หาย)')) return;
      api('clearHistory').then(function () {
        localStorage.removeItem(K_LOCAL);
        state.res = null;
        toast('ล้างประวัติแล้ว');
        refresh(true);
      }).catch(function (err) { toast(err.message); });
    },

    // AI Actions
    aiGo: function (id) {
      const map = { chat: 'chat', gen: 'gen', docs: 'docs' };
      state.aiTab = map[id] || 'chat';
      goTo('chat');
    },
    aiTab: function (id) { state.aiTab = id; render(); },
    sendChat: function () { sendChat(); },
    mic: function () { toggleMic(); },
    suggest: function (id, el) {
      const t = el.getAttribute('data-text');
      const box = byId('chatIn');
      if (box) box.value = t;
      state.chatDraft = t;
      sendChat(t);
    },
    speakAI: function (id) {
      const m = chatLog().find(function (x) { return String(x.t) === String(id); });
      if (m) speakText('ai' + m.t, 'คำตอบ AI', plainText(m.text));
    },
    doGen: function () { genQuiz(); },
    startGenExam: function () {
      if (!state.genResult || !state.genResult.length) return;
      if (!guardSession()) return;
      const qs = state.genResult.map(snapQ);
      startSession({ mode: 'practice', qs: qs });
    },
    scanFolder: function () {
      if (!navigator.onLine) { toast('ต้องต่ออินเทอร์เน็ต'); return; }
      toast('กำลังสแกนหาไฟล์ใน Drive...');
      api('scanFolder').then(function (r) {
        toast('พบไฟล์ใหม่ ' + r.added + ' ไฟล์ ✅');
        refresh(true);
      }).catch(function (err) { toast(err.message); });
    },
    openFolder: function () {
      const ai = aiInfo();
      if (ai.folderUrl) window.open(ai.folderUrl, '_blank', 'noopener');
    },
    procAll: function () {
      const pend = list('documents').filter(function (d) { return d.status !== 'ประมวลผลแล้ว'; });
      processDocs(pend.map(function (d) { return d.id; }));
    },
    reProc: function (id) { processDocs([id]); },
    chatTopicGo: function (id) { cfg.chatTopic = id; saveCfg(); state.aiTab = 'chat'; goTo('chat'); },
    genTopicGo: function (id) { cfg.genTopic = id; saveCfg(); state.aiTab = 'gen'; goTo('gen'); },

    install: function () {
      if (!state.installEvt) return;
      state.installEvt.prompt();
      state.installEvt = null;
      render();
    },
    hideInstall: function () { localStorage.setItem(K_HIDE, '1'); render(); },
    testVoice: function () { speakText('test', 'ทดสอบเสียง', 'สวัสดีครับ นี่คือเสียงอ่านภาษาไทย สำหรับติวสอบหัวหน้าฝ่ายช่าง'); },
    clearData: function () {
      if (!window.confirm('ล้างข้อมูลที่เก็บในเครื่อง? (ข้อมูลใน Google Sheet ไม่หาย โหลดใหม่ได้)')) return;
      stopAll();
      localStorage.removeItem(K_DATA);
      data = null;
      render();
    },
    resetAll: function () {
      if (pendingCount() && !window.confirm('มีผลสอบ ' + pendingCount() + ' ชุดที่ยังไม่ได้ส่งขึ้นชีต จะหายไปด้วย ยืนยัน?')) return;
      if (!window.confirm('ลบลิงก์ PIN และข้อมูลทั้งหมดในเครื่อง?')) return;
      stopAll();
      endSession();
      [K_DATA, K_CFG, K_LOCAL, K_FLAGS, K_CHAT].forEach(function (k) { localStorage.removeItem(k); });
      cfg = Object.assign({}, DEFAULT_CFG);
      data = null;
      state.view = 'home';
      render();
    }
  };

  const CHANGES = {
    ann: function (v) { cfg.annId = v; cfg.exTopics = []; saveCfg(); state.listenTopic = 'all'; render(); },
    listenTopic: function (v) { state.listenTopic = v; render(); },
    theme: function (v) { cfg.theme = v; saveCfg(); applyTheme(); },
    font: function (v) { cfg.font = v; saveCfg(); applyTheme(); },
    voice: function (v) { cfg.voice = v; saveCfg(); },
    qaPause: function (v) { cfg.qaPause = Number(v) || 5; saveCfg(); player.key = ''; },
    exCount: function (v) {
      const n = parseInt(v, 10);
      if (n > 0) { cfg.exCount = Math.min(n, 300); saveCfg(); }
      render();
    },
    exMin: function (v) {
      const n = parseInt(v, 10);
      if (n > 0) { cfg.exMin = Math.min(n, 300); saveCfg(); }
      render();
    },
    exSmart: function (v, el) { cfg.exSmart = !!el.checked; saveCfg(); },
    chatTopic: function (v) { cfg.chatTopic = v; saveCfg(); },
    aiGeneral: function (v, el) { cfg.aiGeneral = !!el.checked; saveCfg(); },
    chatDraft: function (v) { state.chatDraft = v; },
    genTopic: function (v) { cfg.genTopic = v; saveCfg(); },
    genCount: function (v) { cfg.genCount = Math.max(1, Math.min(10, Number(v) || 10)); saveCfg(); },
    genDiff: function (v) { cfg.genDiff = v; saveCfg(); }
  };

  document.addEventListener('click', function (e) {
    const el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) fn(el.getAttribute('data-id'), el, e);
  });
  document.addEventListener('change', function (e) {
    const el = e.target;
    const k = el && el.getAttribute ? el.getAttribute('data-change') : null;
    if (k && CHANGES[k]) CHANGES[k](el.value, el);
  });
  document.addEventListener('input', function (e) {
    const el = e.target;
    const k = el && el.getAttribute ? el.getAttribute('data-change') : null;
    if (k && CHANGES[k]) CHANGES[k](el.value, el);
  });

  document.addEventListener('keydown', function (e) {
    if (state.view === 'exam' && state.ses) {
      const tg = e.target && e.target.tagName;
      if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
      const i = ['1', '2', '3', '4'].indexOf(e.key);
      if (i > -1) {
        const q = state.ses.qs[state.ses.cur];
        if (q[KEYS[i]]) ACTIONS.pick(LETTERS[i]);
        e.preventDefault();
      } else if (e.key === 'ArrowRight') {
        ACTIONS.sesNav('1');
      } else if (e.key === 'ArrowLeft') {
        ACTIONS.sesNav('-1');
      }
    } else if (state.view === 'chat' && e.key === 'Enter' && !e.shiftKey) {
      const ae = document.activeElement;
      if (ae && ae.id === 'chatIn') {
        e.preventDefault();
        sendChat();
      }
    }
  });

  window.addEventListener('online', function () { state.online = true; renderHeader(); refresh(true); });
  window.addEventListener('offline', function () { state.online = false; renderHeader(); });
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    state.installEvt = e;
    if (state.view === 'home' && isReady()) render();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (state.ses && state.ses.mode === 'mock') tick();
    if (!player.playing) return;
    keepAwake(true);
    try {
      const ss = window.speechSynthesis;
      ss.resume();
      if (!ss.speaking && !ss.pending) { player.token++; startSpeak(player.token); }
    } catch (e) { /* ไม่เป็นไร */ }
  });
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', applyTheme);
    else if (mq.addListener) mq.addListener(applyTheme);
  }
  if (hasTTS()) {
    window.speechSynthesis.onvoiceschanged = function () { if (state.view === 'settings') render(); };
  }

  function registerSW() {
    if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return;
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'activated' && hadController) toast('อัปเดตแอปแล้ว ปิดแล้วเปิดใหม่เพื่อใช้เวอร์ชันล่าสุด');
        });
      });
    }).catch(function () { /* ไม่เป็นไร */ });
  }

  makeAppleIcon();
  render();
  if (state.ses && state.ses.mode === 'mock') startTimer();
  if (cfg.apiUrl && cfg.pin) refresh(true);
  registerSW();
})();
</script>
</body>
</html>
